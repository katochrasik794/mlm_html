<!DOCTYPE html>
<html lang="en" class="">
  <head class="">
    <meta charset="utf-8" class="" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
      class=""
    />
    <title class="">CRM - Layout (Sidebar + Topbar + Content + Footer)</title>
    <link rel="stylesheet" href="/mlm_html//admin//style.css" />
    <script src="https://cdn.tailwindcss.com" class=""></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      .row-hover:hover {
            background-color: #333333;
        }
        /* Custom status badges */
        .status-active { 
            background-color: #1c4532; 
            color: #68d391; 
            padding: 2px 8px; 
            border-radius: 6px; 
            font-size: 0.75rem; /* text-xs */
            font-weight: 500;
            display: inline-flex;
            align-items: center;
        }
        .status-active::before {
            content: '•';
            margin-right: 4px;
            font-size: 1rem;
            line-height: 0.75rem;
        }
        .toggle-switch {
            width: 48px;
            height: 24px;
            background-color: #4a4d51;
            border-radius: 9999px;
            position: relative;
            transition: background-color 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-checkbox:checked + .toggle-switch {
            background-color: var(--accent-blue);
        }

        .toggle-checkbox:checked + .toggle-switch::after {
            transform: translateX(24px);
        }
        
        /* Custom styling for the select dropdown arrow */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>

        <div data-include="components/sidebar.html"></div>

      <div id="main-content" class="overflow-y-auto bg-[#2c2f32] text-white transition-all duration-300 ease-in-out">

    </div>
            </div>
         </main>

     </div>

    <script>
      document.addEventListener("componentsLoaded", () => {
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const sidebarContainer = document.getElementById("sidebar-container");

        hamburgerBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          sidebarContainer.classList.toggle("hidden");
        });
      });
    </script>
    <script src="./js/include.js"></script>
    <script src="./js/admin.js"></script>
      <script>
    const avatarBtn = document.getElementById("avatarBtn");
    const dropdown = document.getElementById("dropdownMenu");

    // Toggle on click
    avatarBtn.addEventListener("click", () => {
      dropdown.classList.toggle("hidden");
    });

    // Close when clicking outside
    document.addEventListener("click", (e) => {
      if (!avatarBtn.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.add("hidden");
      }
    });
  </script>
  <script>
        // Initialize Lucide icons
        lucide.createIcons();

        let currentStep = 1;
        const totalSteps = 2;

        // DOM elements
        const step1Div = document.getElementById('step-1');
        const step2Div = document.getElementById('step-2');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const step1Indicator = document.getElementById('step-1-indicator');
        const step2Indicator = document.getElementById('step-2-indicator');
        const profileForm = document.getElementById('profile-form');
        const spacer = document.getElementById('spacer');
        const uploadButton = document.querySelector('.flex.items-center.space-x-4 button');
        const fileInput = document.getElementById('profile-upload');

        // Handle Image Upload button click (for file input)
        uploadButton.addEventListener('click', () => {
             fileInput.click();
        });


        // Function to check form validity (basic check for required fields)
        function validateStep1() {
            let isValid = true;
            const requiredInputs = profileForm.querySelectorAll('[required]');
            
            requiredInputs.forEach(input => {
                if (!input.value.trim()) {
                    input.classList.add('border-red-500', 'focus:border-red-500');
                    isValid = false;
                } else {
                    input.classList.remove('border-red-500', 'focus:border-red-500');
                }
            });
            
            if (!isValid) {
                alert('Please fill out all required fields.');
            }
            return isValid;
        }


        // Function to update the UI based on the current step
        function updateUI() {
            // 1. Show/Hide Steps and Footer buttons
            if (currentStep === 1) {
                step1Div.classList.remove('hidden');
                step2Div.classList.add('hidden');
                prevBtn.classList.add('hidden');
                spacer.classList.remove('hidden');
            } else if (currentStep === 2) {
                step1Div.classList.add('hidden');
                step2Div.classList.remove('hidden');
                prevBtn.classList.remove('hidden');
                spacer.classList.add('hidden');
            }

            // 2. Update Step Indicators
            // Step 1: Always done or active
            step1Indicator.classList.add('text-accent-blue');
            step1Indicator.classList.remove('text-text-secondary');
            step1Indicator.querySelector('span:first-child').classList.add('border-accent-blue');
            step1Indicator.querySelector('span:first-child').classList.remove('border-gray-600');

            // Step 2
            if (currentStep >= 2) {
                step2Indicator.classList.add('text-accent-blue');
                step2Indicator.classList.remove('text-text-secondary');
                step2Indicator.querySelector('span:first-child').classList.add('border-accent-blue');
                step2Indicator.querySelector('span:first-child').classList.remove('border-gray-600');
            } else {
                step2Indicator.classList.remove('text-accent-blue');
                step2Indicator.classList.add('text-text-secondary');
                step2Indicator.querySelector('span:first-child').classList.remove('border-accent-blue');
                step2Indicator.querySelector('span:first-child').classList.add('border-gray-600');
            }

            // 3. Update Button Text
            if (currentStep === totalSteps) {
                nextBtn.textContent = 'Add user';
            } else {
                nextBtn.textContent = 'Next';
            }
        }

        // Function to gather data and populate the confirmation screen
        function populateConfirmation() {
            const formData = new FormData(profileForm);
            const data = Object.fromEntries(formData.entries());

            // Full Name
            const fullName = `${data.firstName || ''} ${data.lastName || ''}`.trim();
            document.getElementById('confirm-full-name').textContent = fullName || 'N/A';
            document.getElementById('confirm-username').textContent = data.username || 'N/A';
            document.getElementById('confirm-email').textContent = data.email || 'N/A';
            
            // Phone
            const fullPhone = `${data.countryCode || ''} ${data.phone || ''}`.trim();
            document.getElementById('confirm-phone').textContent = fullPhone || 'N/A';
            
            // Status (Checked or Unchecked)
            const statusValue = data.status === 'on' ? 'Active' : 'Inactive';
            document.getElementById('confirm-status').textContent = statusValue;
            
            // Location
            const location = `${data.country || 'N/A'}, ${data.city || 'N/A'}, ${data.state || 'N/A'}`;
            document.getElementById('confirm-location').textContent = location;

            // Address details
            document.getElementById('confirm-address-1').textContent = data.address1 || 'N/A';
            document.getElementById('confirm-address-2').textContent = data.address2 || 'N/A';
            document.getElementById('confirm-zip-code').textContent = data.zipCode || 'N/A';
        }

        // Navigation function
        function navigateStep(direction) {
            let nextStep = currentStep + direction;

            if (nextStep < 1) return; // Cannot go back before step 1

            if (currentStep === 1 && direction === 1) {
                // Moving from Step 1 to Step 2: Validate first
                if (!validateStep1()) {
                    return; // Stop navigation if validation fails
                }
                populateConfirmation();
            } else if (currentStep === totalSteps && direction === 1) {
                // Final action (Step 2 -> Submit)
                alert(`User ${document.getElementById('confirm-full-name').textContent} added successfully! (In a real app, this submits to the backend)`);
                // Optional: Reset to step 1 after submission
                currentStep = 0; 
            }

            currentStep = nextStep;
            updateUI();
        }

        // Event Listeners
        nextBtn.addEventListener('click', () => navigateStep(1));
        // prevBtn has inline click handler: navigateStep(-1)

        // Initial UI load
        window.onload = updateUI;
    </script>

  </body>
