<!DOCTYPE html>
<html lang="en" class="">
  <head class="">
    <meta charset="utf-8" class="" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
      class=""
    />
    <title class="">Plan List - Admin</title>
    <link rel="stylesheet" href="/mlm_html//admin//style.css" />
    <script src="https://cdn.tailwindcss.com" class=""></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      .custom-scrollbar::-webkit-scrollbar {
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #374151; /* Gray-700 */
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background-color: #1f2937; /* Gray-800 */
      }
    </style>
        <script>
        // Custom Tailwind configuration for consistent dark theme colors
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#3b82f6',
                        'dark-bg': '#2c2f32', /* Dark Blue/Gray for cards */
                        'card-bg': '#111827', /* Main background */
                    }
                }
            }
        }
    </script>
  </head>
  <body class="">
    <!-- SIDEBAR (included dynamically) & MAIN CONTENT FLEX LAYOUT -->
    <div class="flex h-screen">
      <div id="sidebar-container" class="relative hidden lg:block">
        <div data-include="components/sidebar.html"></div>
      </div>
      <!-- TOP BAR -->
      <header class="fixed top-0 left-0 lg:left-64 right-0 z-40 w-full bg-[#2c2f32] py-3 px-4 flex items-center justify-between shadow">
        <div class="flex items-center space-x-4 flex-1">
          <!-- HAMBURGER AND MLM - visible below desktop -->
          <div class="flex items-center space-x-2 lg:hidden">
            <button
              id="hamburgerBtn"
              class="text-white p-2 hover:bg-gray-700 rounded"
            >
              <i class="fas fa-bars"></i>
            </button>
            <div class="text-xl font-bold text-red-500">MLM</div>
          </div>

          <!-- SEARCH -->
          <div
            class="flex items-center flex-1 max-w-xl rounded-full px-4 py-2 space-x-3 shadow-lg"
          >
            <i class="fas fa-search text-gray-400"></i>
            <input
              type="text"
              placeholder="Search for a menu"
              class="bg-transparent w-full focus:outline-none text-gray-300 placeholder-gray-400"
            />
          </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="relative ml-4">
          <!-- AVATAR BUTTON -->
          <button id="avatarBtn">
            <img
              src="https://i.pravatar.cc/80"
              class="w-10 h-10 rounded-full border border-gray-700 cursor-pointer"
            />
          </button>

          <!-- DROPDOWN -->
          <div
            id="dropdownMenu"
            class="hidden absolute right-0 mt-3 w-56 bg-gray-800 rounded-xl shadow-xl border border-gray-700 z-50"
          >
            <!-- PROFILE INFO -->
            <div class="px-4 py-3 flex items-center gap-4">
              <div>
                <img
                  src="https://i.pravatar.cc/80"
                  class="w-10 h-10 rounded-full border border-gray-700 cursor-pointer"
                />
              </div>
              <div>
                <p class="text-sm font-semibold">admin</p>
                <p class="text-xs text-gray-400">admin@gmail.com</p>
              </div>
            </div>

            <!-- MENU ITEMS -->
            <ul class="py-2">
              <li>
                <a
                  href="#"
                  class="block px-4 py-2 text-sm hover:bg-gray-700 transition"
                  >Profile & account</a
                >
              </li>
              <li>
                <a
                  href="#"
                  class="block px-4 py-2 text-sm hover:bg-gray-700 transition"
                  >Sign out</a
                >
              </li>
            </ul>
          </div>
        </div>
      </header>
      <div
        id="main-content"
        class="overflow-y-auto bg-[#2c2f32] text-white transition-all duration-300 ease-in-out"
      >
        <!-- DASHBOARD MAIN CONTENT -->

        <div
          id="main-content-wrapper"
          class="fixed top-16 left-0 lg:left-64 right-0 bottom-0 overflow-y-auto overflow-x-hidden flex flex-col transition-all duration-300 ease-in-out"
        >
          <main class="bg-[#1e2022] mx-auto w-full text-white">

            <div class="p-4 sm:p-6 min-h-screen">
              <div class="mb-6 border-b border-gray-700">
                <div class="flex items-end">
                  <div class="flex-1 mb-2 sm:mb-0">
                    <nav aria-label="breadcrumb">
                      <ol class="flex items-center text-sm text-gray-500">
                        <li class="flex items-center">
                          <a
                            class="text-gray-400 hover:text-gray-700"
                            href="javascript:void(0);"
                            >Dashboard</a
                          >
                          <span class="mx-2">/</span>
                        </li>
                        <li class="text-white font-medium" aria-current="page">
                          Staff List
                        </li>
                      </ol>
                    </nav>
                    <h1 class="text-2xl font-bold text-white mt-2 mb-10">
                      Staff List
                    </h1>
                  </div>
                </div>
              </div>

              <div class="mx-auto rounded-xl shadow-2xl container-card p-6 md:p-8 bg-dark-bg">

        <!-- Header and Search Bar -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            
            <!-- Search Input -->
            <div class="relative w-full md:w-80">
                <input type="text" placeholder="Search Staff" class="w-full pl-10 pr-4 py-2 rounded-lg bg-dark-bg border border-gray-700 focus:ring-brand-blue focus:border-brand-blue transition duration-150" aria-label="Search staff members">
                <!-- Search Icon (Magnifying glass) -->
                <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>

            <!-- Add New Button (with specific link) -->
            <a href="add-staff.html" class="flex items-center justify-center px-4 py-2 bg-blue-600 text-white font-medium rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition duration-150 w-full md:w-auto">
                <!-- Plus Icon -->
                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add New
            </a>
        </div>

        <!-- Staff Table -->
        <div class="overflow-x-auto rounded-lg">
            <table class="min-w-full divide-y divide-gray-700 border border-gray-700">
                <!-- Table Head -->
                <thead class="table-header bg-gray-600">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">NO.</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">USER</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">ROLE</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">STATUS</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">ACTION</th>
                    </tr>
                </thead>
                <!-- Table Body -->
                <tbody class="divide-y divide-gray-700">
                    <!-- Row 1: Admin -->
                    <tr class="table-row hover:bg-gray-800 transition duration-150">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">1</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <!-- User Avatar (Placeholder) -->
                                <div class="flex-shrink-0 h-10 w-10 rounded-full bg-orange-500 flex items-center justify-center text-lg font-bold text-white">
                                    <img class="h-10 w-10 rounded-full" src="https://placehold.co/40x40/f97316/ffffff?text=A" alt="Admin Avatar" onerror="this.onerror=null; this.src='https://placehold.co/40x40/f97316/ffffff?text=A'">
                                </div>
                                <div class="ml-4">
                                    <div class="text-sm font-medium text-white">admin</div>
                                    <div class="text-xs text-gray-400">@admin</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-900 text-role-admin">
                                Admin
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <div class="flex items-center">
                                <span class="h-2 w-2 rounded-full bg-status-active mr-2"></span>
                                <span class="text-xs text-status-active">Active</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <!-- Action Dropdown Container -->
                            <div class="relative inline-block text-left">
                                <a href="update-staff.html" class="inline-flex items-center justify-center px-3 py-2 border border-gray-600 rounded-lg shadow-sm text-sm font-medium text-gray-300 bg-gray-700 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-brand-blue transition duration-150">
                                    <!-- Edit Icon (Pencil) -->
                                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-7-7l-2 2m4 0l-2 2m0-4v4m0 0H8"></path></svg>
                                    Update Staff
                                </a>
                                <!-- Dropdown arrow placeholder -->
                                <button type="button" class="inline-flex justify-center p-2 rounded-lg text-sm font-medium text-gray-300 ml-1 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-brand-blue" aria-expanded="true" aria-haspopup="true">
                                    <svg class="-mr-1 ml-1 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                                <!-- Dropdown menu items would go here (hidden by default) -->
                            </div>
                        </td>
                    </tr>
                    
                    <!-- Row 2: Manager -->
                    <tr class="table-row hover:bg-gray-800 transition duration-150">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">2</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <!-- User Avatar (Placeholder) -->
                                <div class="flex-shrink-0 h-10 w-10 rounded-full bg-blue-600 flex items-center justify-center text-lg font-bold text-white">
                                    <img class="h-10 w-10 rounded-full" src="https://placehold.co/40x40/3b82f6/ffffff?text=M" alt="Manager Avatar" onerror="this.onerror=null; this.src='https://placehold.co/40x40/3b82f6/ffffff?text=M'">
                                </div>
                                <div class="ml-4">
                                    <div class="text-sm font-medium text-white">Manager</div>
                                    <div class="text-xs text-gray-400">@manager</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-emerald-900 text-role-manager">
                                Manager
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <div class="flex items-center">
                                <span class="h-2 w-2 rounded-full bg-status-active mr-2"></span>
                                <span class="text-xs text-status-active">Active</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <!-- Action Dropdown Container -->
                            <div class="relative inline-block text-left">
                                <a href="update-staff.html" class="inline-flex items-center justify-center px-3 py-2 border border-gray-600 rounded-lg shadow-sm text-sm font-medium text-gray-300 bg-gray-700 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-brand-blue transition duration-150">
                                    <!-- Edit Icon (Pencil) -->
                                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-7-7l-2 2m4 0l-2 2m0-4v4m0 0H8"></path></svg>
                                    Update Staff
                                </a>
                                <!-- Dropdown arrow placeholder -->
                                <button type="button" class="inline-flex justify-center p-2 rounded-lg text-sm font-medium text-gray-300 ml-1 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-brand-blue" aria-expanded="true" aria-haspopup="true">
                                    <svg class="-mr-1 ml-1 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                                    </svg>
                                </button>
                                <!-- Dropdown menu items would go here (hidden by default) -->
                            </div>
                        </td>
                    </tr>
                    
                    <!-- Placeholder for more rows -->

                </tbody>
            </table>
        </div>

        <!-- Pagination/Summary -->
        <div class="flex justify-start text-sm mt-4">
            <p class="text-gray-400">Showing: <span class="font-semibold text-white">15</span> of <span class="font-semibold text-white">2</span></p>
        </div>

    </div>
            </div>
          </main>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("componentsLoaded", () => {
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const sidebarContainer = document.getElementById("sidebar-container");

        hamburgerBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          sidebarContainer.classList.toggle("hidden");
        });
      });
    </script>
    <script src="./js/include.js"></script>
    <script src="./js/admin.js"></script>
    <script>
      const avatarBtn = document.getElementById("avatarBtn");
      const dropdown = document.getElementById("dropdownMenu");

      // Toggle on click
      avatarBtn.addEventListener("click", () => {
        dropdown.classList.toggle("hidden");
      });

      // Close when clicking outside
      document.addEventListener("click", (e) => {
        if (!avatarBtn.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.classList.add("hidden");
        }
      });
    </script>
  </body>
</html>
