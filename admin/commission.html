        <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
        
        // Function to replace lucide icon names with SVG elements
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        // --- Core Pagination and Data Logic ---
        const ITEMS_PER_PAGE = 5;
        let currentPage = 1;
        
        // Mock Data for the table (15 entries for 3 full pages)
        const mockData = [
            { sl: 1, user: { name: "MOSHARAF HOSSAIN", username: "@demouser", initial: 'M', color: 'bg-yellow-500' }, bonusFrom: "Aaron Smith", amount: 3.00, remarks: "Level 1 Referral Bonus From aaron smith", time: "01 Nov 2024" },
            { sl: 2, user: { name: "MOSHARAF HOSSAIN", username: "@demouser", initial: 'M', color: 'bg-yellow-500' }, bonusFrom: "Roman Novikov", amount: 0.05, remarks: "Level 1 Referral Bonus From Roman Novikov", time: "01 Nov 2024" },
            { sl: 3, user: { name: "appexin2 appexin2", username: "@appexin2", initial: 'A', color: 'bg-blue-500' }, bonusFrom: "appexin3 appexin3", amount: 0.38, remarks: "Level 1 Referral Bonus From appexin3", time: "01 Nov 2024" },
            { sl: 4, user: { name: "NH SuMoN", username: "@Nhsumon0038", initial: 'N', color: 'bg-teal-500' }, bonusFrom: "Md Rasel Shekh", amount: 3.12, remarks: "Level 1 Referral Bonus From Rasel01", time: "01 Nov 2024" },
            { sl: 5, user: { name: "MOSHARAF HOSSAIN", username: "@demouser", initial: 'M', color: 'bg-yellow-500' }, bonusFrom: "Aaron Smith", amount: 3.00, remarks: "Level 2 Deposit Commission From Aaron", time: "01 Nov 2024" }, // Page 1 ends
            
            { sl: 6, user: { name: "test2 test2", username: "@test2", initial: 'T', color: 'bg-red-500' }, bonusFrom: "test3 test3", amount: 0.72, remarks: "Level 1 Referral Bonus From test3", time: "31 Oct 2024" },
            { sl: 7, user: { name: "Ervin Howell", username: "@Antoinette", initial: 'E', color: 'bg-indigo-500' }, bonusFrom: "Clementine Bauch", amount: 0.72, remarks: "Level 3 Profit Commission From Samantha", time: "31 Oct 2024" },
            { sl: 8, user: { name: "appexin1 appexin1", username: "@appexin1", initial: 'A', color: 'bg-blue-500' }, bonusFrom: "appexin23 appexin23", amount: 3.00, remarks: "Level 1 Referral Bonus From appexin23", time: "31 Oct 2024" },
            { sl: 9, user: { name: "appexin1 appexin1", username: "@appexin1", initial: 'A', color: 'bg-blue-500' }, bonusFrom: "appexin3 appexin3", amount: 0.19, remarks: "Level 2 Referral Bonus From appexin3", time: "31 Oct 2024" },
            { sl: 10, user: { name: "LEANNE GRAHAM", username: "@Bret", initial: 'L', color: 'bg-pink-500' }, bonusFrom: "John Doe", amount: 15.00, remarks: "Level 1 Investment Bonus From John Doe", time: "30 Oct 2024" }, // Page 2 ends
            
            { sl: 11, user: { name: "Nicholas Runolfsdottir", username: "@Maxime_Nienow", initial: 'N', color: 'bg-green-500' }, bonusFrom: "Kurtis Weissnat", amount: 2.50, remarks: "Level 1 Investment Bonus From Kurtis", time: "30 Oct 2024" },
            { sl: 12, user: { name: "Glenna Reichert", username: "@Delphine", initial: 'G', color: 'bg-purple-500' }, bonusFrom: "Clementina DuBuque", amount: 0.45, remarks: "Level 4 Deposit Commission From Clementina", time: "30 Oct 2024" },
            { sl: 13, user: { name: "Kurtis Weissnat", username: "@Elwyn.Skiles", initial: 'K', color: 'bg-orange-500' }, bonusFrom: "Patricia Lebsack", amount: 1.00, remarks: "Level 1 Referral Bonus From Patricia Lebsack", time: "29 Oct 2024" },
            { sl: 14, user: { name: "Clementina DuBuque", username: "@Moriah.Stanton", initial: 'C', color: 'bg-red-500' }, bonusFrom: "Chelsey Dietrich", amount: 0.99, remarks: "Level 1 Referral Bonus From Chelsey", time: "29 Oct 2024" },
            { sl: 15, user: { name: "Patricia Lebsack", username: "@Karianne", initial: 'P', color: 'bg-teal-500' }, bonusFrom: "Mrs. Dennis Schulist", amount: 5.00, remarks: "Level 2 Profit Commission From Mrs. Dennis", time: "28 Oct 2024" } // Page 3 ends
        ];
        
        const totalPages = Math.ceil(mockData.length / ITEMS_PER_PAGE);

        function renderTable(data) {
            const tableBody = document.getElementById('commission-table-body');
            tableBody.innerHTML = ''; // Clear existing rows

            data.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'border-t border-border-dark row-hover text-sm';
                
                // Helper to create table cell content with optional classes
                const createCell = (content, className = '') => `<td class="p-4 ${className} text-gray-300 align-middle">${content}</td>`;

                const userCellContent = `
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full ${item.user.color} flex items-center justify-center font-bold text-white text-base">
                            ${item.user.initial}
                        </div>
                        <div>
                            <div class="text-white font-medium">${item.user.name}</div>
                            <div class="text-xs text-gray-400">${item.user.username}</div>
                        </div>
                    </div>
                `;
                
                row.innerHTML = `
                    ${createCell(item.sl, 'text-center text-gray-400')}
                    ${createCell(userCellContent)}
                    ${createCell(item.bonusFrom, 'font-medium')}
                    ${createCell(`$${item.amount.toFixed(2)}`, 'font-bold text-green-400')}
                    ${createCell(item.remarks, 'text-gray-400')}
                    ${createCell(item.time, 'text-right text-gray-400')}
                `;
                tableBody.appendChild(row);
            });
            
            // Re-render Lucide icons if any were used (only search icon used here)
            lucide.createIcons();
        }

        function renderPagination() {
            const paginationContainer = document.getElementById('pagination-container');
            const infoText = document.getElementById('pagination-info');
            
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = Math.min(start + ITEMS_PER_PAGE, mockData.length);

            infoText.textContent = `Showing: ${start + 1}-${end} of ${mockData.length}`;

            // Create pagination buttons
            let paginationHtml = '';
            
            // Previous button
            paginationHtml += `
                <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}
                    class="pagination-btn px-4 py-2 rounded-lg bg-card-bg text-gray-300 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-600 transition duration-150 mr-2">
                    Prev
                </button>
            `;

            // Page buttons (display up to 5 buttons, centered around current page)
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);

            // Adjust start/end to ensure 5 buttons are shown if possible
            if (endPage - startPage + 1 < maxVisiblePages) {
                if (startPage === 1) {
                    endPage = Math.min(totalPages, maxVisiblePages);
                } else if (endPage === totalPages) {
                    startPage = Math.max(1, totalPages - maxVisiblePages + 1);
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationHtml += `
                    <button onclick="goToPage(${i})" 
                        class="pagination-btn ${i === currentPage ? 'active' : 'bg-card-bg hover:bg-gray-600 text-gray-300'}">
                        ${i}
                    </button>
                `;
            }

            // Next button
            paginationHtml += `
                <button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}
                    class="pagination-btn px-4 py-2 rounded-lg bg-card-bg text-gray-300 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-600 transition duration-150 ml-2">
                    Next
                </button>
            `;

            paginationContainer.innerHTML = paginationHtml;
        }

        function goToPage(page) {
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                const start = (currentPage - 1) * ITEMS_PER_PAGE;
                const end = start + ITEMS_PER_PAGE;
                const dataToShow = mockData.slice(start, end);
                
                renderTable(dataToShow);
                renderPagination();
            }
        }

        // Initial load
        window.onload = () => {
            goToPage(1);
        };

    </script>
  </head>
  <body class="">

    <script>
      document.addEventListener("componentsLoaded", () => {
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const sidebarContainer = document.getElementById("sidebar-container");

        hamburgerBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          sidebarContainer.classList.toggle("hidden");
        });
      });
    </script>
    <script src="./js/include.js"></script>
    <script src="./js/admin.js"></script>
    <script>
      const avatarBtn = document.getElementById("avatarBtn");
      const dropdown = document.getElementById("dropdownMenu");

      // Toggle on click
      avatarBtn.addEventListener("click", () => {
        dropdown.classList.toggle("hidden");
      });

      // Close when clicking outside
      document.addEventListener("click", (e) => {
        if (!avatarBtn.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.classList.add("hidden");
        }
      });
    </script>
