    <script>
      document.addEventListener("componentsLoaded", () => {

    <script>
      const avatarBtn = document.getElementById("avatarBtn");
      const dropdown = document.getElementById("dropdownMenu");

      // Toggle on click
      avatarBtn.addEventListener("click", () => {
        dropdown.classList.toggle("hidden");
      });

      // Close when clicking outside
      document.addEventListener("click", (e) => {
        if (!avatarBtn.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.classList.add("hidden");
        }
      });
    </script>
        <!-- JavaScript for Table Rendering and Modal Functionality -->
    <script type="module">
        // Import necessary Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase setup (MANDATORY variables for Canvas environment)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // Initialize Firebase
        let auth, db;
        if (Object.keys(firebaseConfig).length > 0) {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                setLogLevel('Debug'); // Enable debug logging

                // Authenticate user
                if (initialAuthToken) {
                    signInWithCustomToken(auth, initialAuthToken).catch(e => console.error("Firebase Custom Token Sign-In Failed:", e));
                } else {
                    signInAnonymously(auth).catch(e => console.error("Firebase Anonymous Sign-In Failed:", e));
                }
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        console.log("User authenticated:", user.uid);
                    } else {
                        console.log("User signed out or anonymous.");
                    }
                });
            } catch (e) {
                console.error("Firebase Initialization Error:", e);
            }
        }
        
        // --- Mock Data (Expanded for Pagination) ---
        const subscribers = [
            { id: 101, email: "kendev@visionsbet.com", joined: "27 Oct 2024" },
            { id: 102, email: "Pkgk7769@gmail.com", joined: "24 Oct 2024" },
            { id: 103, email: "aadeebaali812@gmail.com", joined: "14 Oct 2024" },
            { id: 104, email: "d962636@gmail.com", joined: "14 Oct 2024" },
            { id: 105, email: "hrestrepo@ulterea.com", joined: "17 Oct 2024" },
            { id: 106, email: "alfirsyad45@gmail.com", joined: "31 Oct 2024" },
            { id: 107, email: "qeahsanali5712@gmail.com", joined: "24 Oct 2024" },
            
            // Page 2 Entries
            { id: 108, email: "ghullamyaseen123456789@gmail.com", joined: "17 Oct 2024" },
            { id: 109, email: "ra1342536@gmail.com", joined: "21 Oct 2024" },
            { id: 110, email: "afk@gmail.com", joined: "20 Oct 2024" },
            { id: 111, email: "ghareebn846@gmail.com", joined: "17 Oct 2024" },
            { id: 112, email: "raxixh@gmail.com", joined: "31 Oct 2024" },
            { id: 113, email: "tester6@example.com", joined: "01 Nov 2024" },
            { id: 114, email: "tester7@example.com", joined: "02 Nov 2024" },
            
            // Page 3 Entries
            { id: 115, email: "newuser1@example.com", joined: "03 Nov 2024" },
            { id: 116, email: "newuser2@example.com", joined: "04 Nov 2024" },
            { id: 117, email: "newuser3@example.com", joined: "05 Nov 2024" },
            { id: 118, email: "newuser4@example.com", joined: "06 Nov 2024" },
            { id: 119, email: "newuser5@example.com", joined: "07 Nov 2024" },
            { id: 120, email: "newuser6@example.com", joined: "08 Nov 2024" },
            { id: 121, email: "newuser7@example.com", joined: "09 Nov 2024" },

            // Additional Entries for a 4th page
            { id: 122, email: "lastentry@example.com", joined: "10 Nov 2024" },
        ];

        // --- Pagination State ---
        const ENTRIES_PER_PAGE = 7;
        let currentPage = 1;
        const totalPages = Math.ceil(subscribers.length / ENTRIES_PER_PAGE);


        // --- Main Render Function ---
        function renderApp() {
            renderSubscriberList();
            renderPagination();
            lucide.createIcons(); // Ensure all icons are rendered
        }

        // --- Table Rendering Function ---
        function renderSubscriberList() {
            const listContainer = document.getElementById('subscriber-list');
            listContainer.innerHTML = ''; // Clear previous content

            const startIndex = (currentPage - 1) * ENTRIES_PER_PAGE;
            const endIndex = startIndex + ENTRIES_PER_PAGE;
            const currentEntries = subscribers.slice(startIndex, endIndex);

            currentEntries.forEach((subscriber, index) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-800 transition duration-150';
                
                // Calculate the actual sequential number across all pages
                const rowNumber = startIndex + index + 1;

                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-500">${rowNumber}.</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-white">${subscriber.email}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400">${subscriber.joined}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium">
                        <button data-subscriber-id="${subscriber.id}" class="delete-btn inline-flex items-center space-x-1 px-3 py-1 border border-gray-600 rounded-md shadow-sm text-xs font-medium text-red-400 bg-gray-700 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition duration-150">
                            <i data-lucide="trash-2" class="h-4 w-4"></i>
                            <span>Delete</span>
                        </button>
                    </td>
                `;
                listContainer.appendChild(row);
            });

            // Update footer info
            const totalEntries = subscribers.length;
            const startDisplay = startIndex + 1;
            const endDisplay = Math.min(startIndex + currentEntries.length, totalEntries);
            document.getElementById('showing-entries').textContent = `${startDisplay}-${endDisplay}`;
            document.getElementById('total-entries').textContent = totalEntries;

            // Re-render Lucide icons after dynamic content insertion
            lucide.createIcons();
        }

        // --- Pagination Control Function ---
        function renderPagination() {
            const controlsContainer = document.getElementById('pagination-controls');
            controlsContainer.innerHTML = '';
            
            // Previous Button
            const prevDisabled = currentPage === 1;
            controlsContainer.innerHTML += `
                <button onclick="window.changePage(${currentPage - 1})" 
                        class="px-3 py-1 bg-dark-bg ${prevDisabled ? 'text-gray-500 cursor-not-allowed' : 'text-white hover:bg-gray-700'} rounded-md transition duration-150" 
                        ${prevDisabled ? 'disabled' : ''}>Prev</button>
            `;

            // Page Buttons (Render up to 3 visible pages, plus ellipsis if needed, and the last page)
            const maxVisiblePages = 3;
            const pageButtons = [];

            // Helper to create a page button
            const createPageButton = (page) => {
                const isActive = page === currentPage;
                const baseClasses = 'px-3 py-1 rounded-md transition duration-150 font-semibold';
                const activeClasses = 'bg-primary-blue text-white';
                const defaultClasses = 'bg-dark-bg hover:bg-gray-700';

                return `<button onclick="window.changePage(${page})" 
                                class="${baseClasses} ${isActive ? activeClasses : defaultClasses}"
                                ${isActive ? 'disabled' : ''}>${page}</button>`;
            };

            // 1. Render the first page
            if (totalPages >= 1) {
                pageButtons.push(createPageButton(1));
            }
            
            // 2. Render pages 2 and 3, or current page neighborhood
            for (let i = 2; i <= Math.min(totalPages, maxVisiblePages); i++) {
                 // Prevent re-rendering page 1 if loop starts at 2
                 if (i !== 1) {
                    pageButtons.push(createPageButton(i));
                 }
            }
            
            // 3. Render Ellipsis and Last Page (if more than maxVisiblePages exist)
            if (totalPages > maxVisiblePages) {
                if (currentPage > maxVisiblePages) {
                    // If the current page is beyond the initial visible set, show it
                    pageButtons.push(createPageButton(currentPage));
                }
                
                if (currentPage < totalPages - 1 && currentPage >= maxVisiblePages) {
                    pageButtons.push(`<span class="px-3 py-1">...</span>`);
                }
                
                // Show last page only if it's not already shown
                if (totalPages > maxVisiblePages) {
                    if (pageButtons.map(btn => btn.includes(`changePage(${totalPages})`)).includes(true) === false) {
                        pageButtons.push(createPageButton(totalPages));
                    }
                }
            }


            controlsContainer.innerHTML += pageButtons.join('');


            // Next Button
            const nextDisabled = currentPage === totalPages;
            controlsContainer.innerHTML += `
                <button onclick="window.changePage(${currentPage + 1})" 
                        class="px-3 py-1 bg-dark-bg ${nextDisabled ? 'text-gray-500 cursor-not-allowed' : 'text-white hover:bg-gray-700'} rounded-md transition duration-150"
                        ${nextDisabled ? 'disabled' : ''}>Next</button>
            `;
        }

        // --- Page Change Handler ---
        window.changePage = (newPage) => {
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderApp();
            }
        };


        // --- Modal Control Functions ---
        const modal = document.getElementById('confirmation-modal');
        const confirmBtn = document.getElementById('confirm-delete-btn');
        let currentSubscriberId = null;

        window.toggleModal = (show, subscriberId = null) => {
            if (show) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                currentSubscriberId = subscriberId;
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                currentSubscriberId = null;
            }
        };

        // Attach event listener to the main table body (event delegation)
        document.getElementById('subscriber-list').addEventListener('click', (e) => {
            const deleteButton = e.target.closest('.delete-btn');
            if (deleteButton) {
                const subscriberId = deleteButton.getAttribute('data-subscriber-id');
                // Show the modal and pass the ID
                window.toggleModal(true, subscriberId);
            }
        });
        
        // Handle the Confirm action
        confirmBtn.addEventListener('click', () => {
            if (currentSubscriberId !== null) {
                console.log(`Confirmed deletion for subscriber ID: ${currentSubscriberId}`);
                // In a real application, you would perform the Firestore delete operation here.
                // For demonstration, we just close the modal.
                window.toggleModal(false);
            }
        });

        // Hide modal when clicking outside of it (on the backdrop)
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                window.toggleModal(false);
            }
        });

        // Initialize on page load
        window.onload = () => {
            renderApp();
        };
    </script>
