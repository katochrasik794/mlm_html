<!DOCTYPE html>
<html lang="en" class="">
  <head class="">
    <meta charset="utf-8" class="" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
      class=""
    />
    <title class="">Plan List - Admin</title>
    <link rel="stylesheet" href="/mlm_html//admin//style.css" />
    <script src="https://cdn.tailwindcss.com" class=""></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      .custom-scrollbar::-webkit-scrollbar {
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #374151; /* Gray-700 */
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background-color: #1f2937; /* Gray-800 */
      }
    </style>
        <script>
        // Custom Tailwind configuration for consistent dark theme colors
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#3b82f6',
                        'dark-bg': '#2c2f32', /* Dark Blue/Gray for cards */
                        'card-bg': '#111827', /* Main background */
                    }
                }
            }
        }
    </script>
  </head>
  <body class="">
    <!-- SIDEBAR (included dynamically) & MAIN CONTENT FLEX LAYOUT -->
    <div class="flex h-screen">
      <div id="sidebar-container" class="relative hidden lg:block">
        <div data-include="components/sidebar.html"></div>
      </div>
      <!-- TOP BAR -->
      <header class="fixed top-0 left-0 lg:left-64 right-0 z-40 w-full bg-[#2c2f32] py-3 px-4 flex items-center justify-between shadow">
        <div class="flex items-center space-x-4 flex-1">
          <!-- HAMBURGER AND MLM - visible below desktop -->
          <div class="flex items-center space-x-2 lg:hidden">
            <button
              id="hamburgerBtn"
              class="text-white p-2 hover:bg-gray-700 rounded"
            >
              <i class="fas fa-bars"></i>
            </button>
            <div class="text-xl font-bold text-red-500">MLM</div>
          </div>

          <!-- SEARCH -->
          <div
            class="flex items-center flex-1 max-w-xl rounded-full px-4 py-2 space-x-3 shadow-lg"
          >
            <i class="fas fa-search text-gray-400"></i>
            <input
              type="text"
              placeholder="Search for a menu"
              class="bg-transparent w-full focus:outline-none text-gray-300 placeholder-gray-400"
            />
          </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="relative ml-4">
          <!-- AVATAR BUTTON -->
          <button id="avatarBtn">
            <img
              src="https://i.pravatar.cc/80"
              class="w-10 h-10 rounded-full border border-gray-700 cursor-pointer"
            />
          </button>

          <!-- DROPDOWN -->
          <div
            id="dropdownMenu"
            class="hidden absolute right-0 mt-3 w-56 bg-gray-800 rounded-xl shadow-xl border border-gray-700 z-50"
          >
            <!-- PROFILE INFO -->
            <div class="px-4 py-3 flex items-center gap-4">
              <div>
                <img
                  src="https://i.pravatar.cc/80"
                  class="w-10 h-10 rounded-full border border-gray-700 cursor-pointer"
                />
              </div>
              <div>
                <p class="text-sm font-semibold">admin</p>
                <p class="text-xs text-gray-400">admin@gmail.com</p>
              </div>
            </div>

            <!-- MENU ITEMS -->
            <ul class="py-2">
              <li>
                <a
                  href="#"
                  class="block px-4 py-2 text-sm hover:bg-gray-700 transition"
                  >Profile & account</a
                >
              </li>
              <li>
                <a
                  href="#"
                  class="block px-4 py-2 text-sm hover:bg-gray-700 transition"
                  >Sign out</a
                >
              </li>
            </ul>
          </div>
        </div>
      </header>
      <div
        id="main-content"
        class="overflow-y-auto bg-[#2c2f32] text-white transition-all duration-300 ease-in-out"
      >
        <!-- DASHBOARD MAIN CONTENT -->

        <div
          id="main-content-wrapper"
          class="fixed top-16 left-0 lg:left-64 right-0 bottom-0 overflow-y-auto overflow-x-hidden flex flex-col transition-all duration-300 ease-in-out"
        >
          <main class="bg-[#1e2022] mx-auto w-full text-white">

            <div class="p-4 sm:p-6 min-h-screen">
              <div class="mb-6 border-b border-gray-700">
                <div class="flex items-end">
                  <div class="flex-1 mb-2 sm:mb-0">
                    <nav aria-label="breadcrumb">
                      <ol class="flex items-center text-sm text-gray-500 mb-8">
                        <li class="flex items-center">
                          <a
                            class="text-gray-400 hover:text-gray-700"
                            href="javascript:void(0);"
                            >Dashboard</a
                          >
                          <span class="mx-2">/</span>
                        </li>
                        <li class="text-white font-medium" aria-current="page">
                          Settings
                        </li>
                      </ol>
                    </nav>
                  </div>
                </div>
              </div>
              
              <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold text-white mb-8">System Configuration</h1>
        
        <!-- Settings Grid Container -->
        <!-- Responsive layout: 1 column on mobile, 2 on small/tablet, 3 on larger screens -->
        <div id="settings-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be injected here by JavaScript -->
        </div>
    </div>
            </div>
          </main>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("componentsLoaded", () => {
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const sidebarContainer = document.getElementById("sidebar-container");

        hamburgerBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          sidebarContainer.classList.toggle("hidden");
        });
      });
    </script>
    <script src="./js/include.js"></script>
    <script src="./js/admin.js"></script>
    <script>
      const avatarBtn = document.getElementById("avatarBtn");
      const dropdown = document.getElementById("dropdownMenu");

      // Toggle on click
      avatarBtn.addEventListener("click", () => {
        dropdown.classList.toggle("hidden");
      });

      // Close when clicking outside
      document.addEventListener("click", (e) => {
        if (!avatarBtn.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.classList.add("hidden");
        }
      });
    </script>
        <script>
        // Data for all settings cards, with explicit icons for better visual representation.
const cardsData = [
    { icon: 'settings-2', title: 'Basic Control', link: 'basic-control.html',
      description: 'Basic settings such as, site title, timezone, currency, notifications, verifications and so on.' },

    { icon: 'cookie', title: 'GDPR Cookie', link: 'gdpr-cookie.html',
      description: 'Cookie such as, cookie title, cookie image, text, status, cookie button and so on.' },

    { icon: 'wrench', title: 'App Setting', link: 'app-setting.html',
      description: 'App Settings such as, App base color, App version, App build and so on.' },

    { icon: 'image', title: 'Logo', link: 'logo-setting.html',
      description: 'Logo settings such as, footer logo, admin logo, favicon, breadcrumb.' },

    { icon: 'bell', title: 'Push Notification', link: 'push-notification.html',
      description: 'Push notification settings such as, firebase configuration and push notification templates.' },

    { icon: 'inbox', title: 'In App Notification', link: 'in-app-notification.html',
      description: 'In app notification settings such as, pusher configuration and in app notification templates.' },

    { icon: 'mail', title: 'Email', link: 'email-setting.html',
      description: 'Email settings such as, email configuration and email templates.' },

    { icon: 'message-square', title: 'sms-setting.html', link: 'sms-setting.html',
      description: 'SMS settings such as, SMS configuration and SMS templates.' },

    { icon: 'globe-lock', title: 'Language', link: 'language.html',
      description: 'Language settings such as, create new language, add keywords and so on.' },

    { icon: 'archive', title: 'Storage', link: 'storage.html',
      description: 'Storage settings such as, store images.' },

    { icon: 'shuffle', title: 'Exchange API', link: 'exchange-api.html',
      description: 'Currency Layer Access Key, Coin Market Cap App Key, Select update time and so on.' },

    { icon: 'file-text', title: 'Translate Api', link: 'translate-api.html',
      description: 'Translate API service for google sheet, drive and others.' },

    { icon: 'plug-2', title: 'Plugin', link: 'plugin.html',
      description: 'Manage and configure third-party plugins, hooks, and extensions for custom features.' },

    { icon: 'hard-hat', title: 'Maintenance Mode', link: 'maintenance-mode.html',
      description: 'Activate or deactivate maintenance mode, configure message, and set access bypass rules.' },
];

        /**
         * Generates the HTML string for a single setting card.
         * @param {object} data - Card data including icon, title, and description.
         * @returns {string} The card HTML.
         */
function createCardHtml(data) {
    return `
        <div class="bg-dark-bg p-6 rounded-xl shadow-lg border border-gray-800 hover:border-primary-blue transition duration-200 cursor-pointer">
            <div class="flex items-start space-x-4">
                <div class="p-3 rounded-full bg-gray-700/50 text-primary-blue">
                    <i data-lucide="${data.icon}" class="h-6 w-6"></i>
                </div>
                <div>
                    <h3 class="text-lg font-medium text-white mb-1">${data.title}</h3>
                    <p class="text-sm text-gray-400 mb-3">${data.description}</p>
                    <a href="${data.link}" class="text-sm font-medium hover:underline flex items-center space-x-1">
                        <span>Change Setting</span>
                        <i data-lucide="chevron-right" class="h-4 w-4"></i>
                    </a>
                </div>
            </div>
        </div>
    `;
}


        // Render all cards into the grid
        document.addEventListener('DOMContentLoaded', () => {
            const settingsGrid = document.getElementById('settings-grid');
            
            // Map the data to HTML strings and join them
            settingsGrid.innerHTML = cardsData.map(createCardHtml).join('');

            // Re-render Lucide icons after dynamic content insertion
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
  </body>
</html>
