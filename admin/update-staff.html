<!DOCTYPE html>
<html lang="en" class="">
  <head class="">
    <meta charset="utf-8" class="" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
      class=""
    />
    <title class="">Plan List - Admin</title>
    <link rel="stylesheet" href="/mlm_html//admin//style.css" />
    <script src="https://cdn.tailwindcss.com" class=""></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      .custom-scrollbar::-webkit-scrollbar {
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #374151; /* Gray-700 */
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background-color: #1f2937; /* Gray-800 */
      }
    </style>
        <script>
        // Custom Tailwind configuration for consistent dark theme colors
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#3b82f6',
                        'dark-bg': '#2c2f32', /* Dark Blue/Gray for cards */
                        'card-bg': '#111827', /* Main background */
                    }
                }
            }
        }
    </script>
  </head>
  <body class="">
    <!-- SIDEBAR (included dynamically) & MAIN CONTENT FLEX LAYOUT -->
    <div class="flex h-screen">
      <div id="sidebar-container" class="relative hidden lg:block">
        <div data-include="components/sidebar.html"></div>
      </div>
      <!-- TOP BAR -->
      <header class="fixed top-0 left-0 lg:left-64 right-0 z-40 w-full bg-[#2c2f32] py-3 px-4 flex items-center justify-between shadow">
        <div class="flex items-center space-x-4 flex-1">
          <!-- HAMBURGER AND MLM - visible below desktop -->
          <div class="flex items-center space-x-2 lg:hidden">
            <button
              id="hamburgerBtn"
              class="text-white p-2 hover:bg-gray-700 rounded"
            >
              <i class="fas fa-bars"></i>
            </button>
            <div class="text-xl font-bold text-red-500">MLM</div>
          </div>

          <!-- SEARCH -->
          <div
            class="flex items-center flex-1 max-w-xl rounded-full px-4 py-2 space-x-3 shadow-lg"
          >
            <i class="fas fa-search text-gray-400"></i>
            <input
              type="text"
              placeholder="Search for a menu"
              class="bg-transparent w-full focus:outline-none text-gray-300 placeholder-gray-400"
            />
          </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="relative ml-4">
          <!-- AVATAR BUTTON -->
          <button id="avatarBtn">
            <img
              src="https://i.pravatar.cc/80"
              class="w-10 h-10 rounded-full border border-gray-700 cursor-pointer"
            />
          </button>

          <!-- DROPDOWN -->
          <div
            id="dropdownMenu"
            class="hidden absolute right-0 mt-3 w-56 bg-gray-800 rounded-xl shadow-xl border border-gray-700 z-50"
          >
            <!-- PROFILE INFO -->
            <div class="px-4 py-3 flex items-center gap-4">
              <div>
                <img
                  src="https://i.pravatar.cc/80"
                  class="w-10 h-10 rounded-full border border-gray-700 cursor-pointer"
                />
              </div>
              <div>
                <p class="text-sm font-semibold">admin</p>
                <p class="text-xs text-gray-400">admin@gmail.com</p>
              </div>
            </div>

            <!-- MENU ITEMS -->
            <ul class="py-2">
              <li>
                <a
                  href="#"
                  class="block px-4 py-2 text-sm hover:bg-gray-700 transition"
                  >Profile & account</a
                >
              </li>
              <li>
                <a
                  href="#"
                  class="block px-4 py-2 text-sm hover:bg-gray-700 transition"
                  >Sign out</a
                >
              </li>
            </ul>
          </div>
        </div>
      </header>
      <div
        id="main-content"
        class="overflow-y-auto bg-[#2c2f32] text-white transition-all duration-300 ease-in-out"
      >
        <!-- DASHBOARD MAIN CONTENT -->

        <div
          id="main-content-wrapper"
          class="fixed top-16 left-0 lg:left-64 right-0 bottom-0 overflow-y-auto overflow-x-hidden flex flex-col transition-all duration-300 ease-in-out"
        >
          <main class="bg-[#1e2022] mx-auto w-full text-white">

            <div class="p-4 sm:p-6 min-h-screen">
              <div class="mb-6 border-b border-gray-700">
                <div class="flex items-end">
                  <div class="flex-1 mb-2 sm:mb-0">
                    <nav aria-label="breadcrumb">
                      <ol class="flex items-center text-sm text-gray-500">
                        <li class="flex items-center">
                          <a
                            class="text-gray-400 hover:text-gray-700"
                            href="javascript:void(0);"
                            >Dashboard</a
                          >
                          <span class="mx-2">/</span>
                        </li>
                        <li class="text-white font-medium" aria-current="page">
                          Edit Staff
                        </li>
                      </ol>
                    </nav>
                    <h1 class="text-2xl font-bold text-white mt-2 mb-10">
                      Edit Staff
                    </h1>
                  </div>
                </div>
              </div>
              
              <div class="max-w-2xl mx-auto rounded-xl shadow-2xl container-card p-6 md:p-8 bg-dark-bg">

        <h1 class="text-xl font-bold mb-8">Staff Information</h1>
        
        <form>
            <!-- Name and Role (Two-column layout) -->
            <div class="input-group">
                <!-- Name Field -->
                <div>
                    <label for="name" class="block text-sm font-medium text-white mb-1">Name</label>
                    <input type="text" id="name" placeholder="Enter staff name" class="w-full px-4 py-2 rounded-lg bg-dark-bg border border-gray-700  transition duration-150">
                </div>

                <!-- Role Field -->
                <div>
                    <label for="role" class="block text-sm font-medium text-white mb-1">Role</label>
                    <select id="role" class="w-full px-4 py-2 rounded-lg bg-dark-bg border border-gray-700  select-field transition duration-150">
                        <option value="">Select a role...</option>
                        <option value="admin">Admin</option>
                        <option value="manager">Manager</option>
                        <option value="editor">Editor</option>
                    </select>
                </div>
            </div>

            <!-- Email Field (Full width) -->
            <div class="mb-6">
                <label for="email" class="block text-sm font-medium text-white mb-1">Email</label>
                <div class="relative">
                    <input type="email" id="email" placeholder="Enter staff email" class="w-full pl-4 pr-10 py-2 rounded-lg bg-dark-bg border border-gray-700  transition duration-150">
                    <!-- Email Icon -->
                    <svg class="absolute right-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8m-2 4v7a2 2 0 01-2 2H7a2 2 0 01-2-2v-7"></path></svg>
                </div>
            </div>

            <!-- Username and Password (Two-column layout) -->
            <div class="input-group mb-8">
                <!-- Username Field -->
                <div>
                    <label for="username" class="block text-sm font-medium text-white mb-1">Username</label>
                    <div class="relative">
                        <input type="text" id="username" placeholder="Enter staff email" class="w-full pl-4 pr-10 py-2 rounded-lg bg-dark-bg border border-gray-700  transition duration-150">
                        <!-- Email Icon (Used for Username in image) -->
                        <svg class="absolute right-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8m-2 4v7a2 2 0 01-2 2H7a2 2 0 01-2-2v-7"></path></svg>
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-white mb-1">Password</label>
                    <input type="password" id="password" placeholder="Enter staff password" class="w-full px-4 py-2 rounded-lg bg-dark-bg border border-gray-700  transition duration-150">
                </div>
            </div>
            
            <!-- Status Toggle Section -->
            <div class="flex items-center justify-between border-t border-gray-700 pt-6">
                <div class="flex items-center">
                    <p class="text-sm font-semibold text-white mr-2">Status</p>
                    <!-- Help Icon (Question mark) -->
                    <svg class="w-4 h-4 text-gray-400 cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c0-1.543.818-3 2.15-3 1.332 0 2.57 1.457 2.57 3 0 2.4-3.5 1.5-3.5 4v1m0-2h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>

                <!-- Toggle Switch (Active for demo) -->
                <label class="toggle-switch relative inline-flex items-center cursor-pointer flex-shrink-0 ml-4">
                    <input type="checkbox" value="" class="sr-only peer" checked>
                    <div class="slider w-10 h-5 rounded-full peer-focus:outline-none after:absolute after:top-[2px] after:left-[2px] after:h-4 after:w-4 after:rounded-full after:bg-white after:transition-all"></div>
                </label>
            </div>

            <!-- Save Button -->
            <div class="mt-8">
                <button type="submit" class="w-full px-6 py-3 bg-blue-600 text-white text-lg font-medium rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition duration-150">
                    Save
                </button>
            </div>
        </form>

    </div>
            </div>
          </main>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("componentsLoaded", () => {
        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const sidebarContainer = document.getElementById("sidebar-container");

        hamburgerBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          sidebarContainer.classList.toggle("hidden");
        });
      });
    </script>
    <script src="./js/include.js"></script>
    <script src="./js/admin.js"></script>
    <script>
      const avatarBtn = document.getElementById("avatarBtn");
      const dropdown = document.getElementById("dropdownMenu");

      // Toggle on click
      avatarBtn.addEventListener("click", () => {
        dropdown.classList.toggle("hidden");
      });

      // Close when clicking outside
      document.addEventListener("click", (e) => {
        if (!avatarBtn.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.classList.add("hidden");
        }
      });
    </script>
  </body>
</html>
