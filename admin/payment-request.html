        // Custom alert function to replace window.alert
        function alertCustom(message) {
            const existingAlert = document.getElementById('customAlert');
            if (existingAlert) existingAlert.remove();

            const alertHtml = document.createElement('div');
            alertHtml.id = 'customAlert';
            alertHtml.className = 'fixed top-4 right-4 z-[9999] bg-blue-600 text-white p-4 rounded-lg shadow-xl flex items-center space-x-3 transition-opacity duration-300';
            alertHtml.innerHTML = `
                <i class="fa-solid fa-bell"></i>
                <span>${message}</span>
                <button onclick="document.getElementById('customAlert').remove()" class="ml-4 text-white hover:text-gray-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;
            document.body.appendChild(alertHtml);
            
            setTimeout(() => {
                const alertElement = document.getElementById('customAlert');
                if (alertElement) alertElement.style.opacity = '0';
                setTimeout(() => {
                    if (alertElement) alertElement.remove();
                }, 300);
            }, 3000);
        }
        
        // --- Modal Control ---

        function toggleModal(modalId, show) {
            const modal = document.getElementById(modalId);
            const content = modal.children[0];
            
            if (show) {
                modal.classList.remove('hidden');
                modal.classList.add('flex', 'opacity-0');
                // Ensure initial position is set before transition starts
                content.classList.remove('scale-100', 'opacity-100');
                content.classList.add('scale-95', 'opacity-0');

                // Start transition
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    content.classList.remove('scale-95');
                    content.classList.add('scale-100', 'opacity-100');
                }, 10);
            } else {
                modal.classList.add('opacity-0');
                content.classList.remove('scale-100', 'opacity-100');
                content.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.remove('flex');
                    modal.classList.add('hidden');
                }, 300); // Wait for transition to finish
            }
        }

        function openEditModal(trxId) {
            const transaction = allTransactions.find(t => t.id === trxId);
            if (!transaction) return;

            // Populate Modal Header
            const headerHtml = `
                <div class="col-span-1">
                    <p class="text-gray-500 font-medium">AMOUNT PAID:</p>
                    <p class="text-white text-lg font-bold">${transaction.methodDetails.amountPaid} ${transaction.amount.includes('EUR') ? 'EUR' : 'USD'}</p>
                </div>
                <div class="col-span-1">
                    <p class="text-gray-500 font-medium">DATE PAID:</p>
                    <p class="text-white text-lg font-bold">${transaction.methodDetails.datePaid}</p>
                </div>
                <div class="col-span-1 text-right">
                    <p class="text-gray-500 font-medium">PAYMENT METHOD:</p>
                    <div class="flex items-center justify-end">
                        <div class="text-white text-lg font-bold">${transaction.method}</div>
                        <div class="w-6 h-6 bg-gray-600 flex items-center justify-center rounded-full ml-2">
                            <i class="${transaction.methodIcon} text-white text-xs"></i>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modalHeaderInfo').innerHTML = headerHtml;

            // Populate Modal Summary
            const summaryData = [
                { label: 'AccountNumber', value: transaction.methodDetails.AccountNumber },
                { label: 'BeneficiaryName', value: transaction.methodDetails.BeneficiaryName },
                { label: 'Address', value: transaction.methodDetails.Address },
            ];

            const summaryHtml = summaryData.map(item => `
                <div class="flex justify-between items-start">
                    <span class="text-gray-400 w-1/3">${item.label}</span>
                    <span class="text-white font-medium w-2/3 text-right break-words">${item.value}</span>
                </div>
            `).join('');

            // NID/Image Placeholder (Based on the image)
            const nidHtml = `
                <div class="flex justify-between items-start">
                    <span class="text-gray-400 w-1/3">NID</span>
                    <div class="w-24 h-20 bg-[#1e1e1e] border border-[#3a3a3a] rounded-lg flex items-center justify-center ml-auto">
                        <i class="fa-regular fa-image text-gray-500 text-2xl"></i>
                    </div>
                </div>
            `;

            document.getElementById('modalSummary').innerHTML = summaryHtml + nidHtml;
            
            toggleModal('editModal', true);
        }

        // --- Table Rendering and Pagination ---

        function renderStats() {
            const stats = [
                { title: 'TOTAL PAYMENT LOG', value: initialStats.total, delta: '2.283%', color: 'blue', totalRef: initialStats.total },
                { title: 'PAYMENT SUCCESS', value: initialStats.success, delta: '3.81%', color: 'green', totalRef: initialStats.total },
                { title: 'PENDING PAYMENT', value: initialStats.pending, delta: '3.46%', color: 'orange', totalRef: initialStats.total },
                { title: 'CANCEL PAYMENT', value: initialStats.cancel, delta: '0%', color: 'red', totalRef: 0 },
            ];

            const container = document.getElementById('statsCards');
            container.innerHTML = stats.map(stat => `
                <div class="main-card stat-card rounded-xl p-5 shadow-md">
                    <p class="text-sm font-medium text-gray-400">${stat.title}</p>
                    <div class="flex items-end justify-between mt-1">
                        <h2 class="text-3xl font-bold text-white">${stat.value}</h2>
                        <span class="text-sm font-semibold text-${stat.color}-400 flex items-center">
                            <i class="fa-solid ${stat.value > 0 ? 'fa-arrow-up' : 'fa-minus'} text-xs mr-1"></i>
                            ${stat.delta}
                        </span>
                    </div>
                    <p class="text-sm text-gray-500 mt-1">From ${stat.totalRef}</p>
                </div>
            `).join('');
        }

        function renderTable() {
            const start = (currentPage - 1) * entriesPerPage;
            const end = start + entriesPerPage;
            const transactionsToShow = filteredTransactions.slice(start, end);

            const tableBody = document.getElementById('transactionTableBody');
            tableBody.innerHTML = ''; // Clear existing rows

            if (transactionsToShow.length === 0) {
                 tableBody.innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center py-6 text-gray-500">No transactions found.</td>
                    </tr>
                `;
            }

            transactionsToShow.forEach(trx => {
                const statusClass = `status-${trx.status.toLowerCase()}`;
                const amountColor = trx.amount.includes('-') ? 'text-red-amount' : 'text-green-amount';
                const actionContent = `<button onclick="openEditModal('${trx.id}')" class="text-gray-400 hover:text-blue-400 transition duration-150 p-1 rounded-full"><i class="fa-solid fa-pencil text-sm"></i></button>`;
                
                const row = `
                    <tr class="table-row hover:bg-gray-800/20">
                        <td class="px-4 py-4 text-gray-300 font-mono text-xs">${trx.id}</td>
                        <td class="px-4 py-4">
                            <div class="flex items-center space-x-3">
                                ${getProfileImageHtml(trx.name)}
                                <div>
                                    <p class="text-white font-medium">${trx.name}</p>
                                    <p class="text-gray-500 text-xs">${trx.username}</p>
                                </div>
                            </div>
                        </td>
                        <td class="px-4 py-4 text-gray-300">${getMethodHtml(trx.methodIcon, trx.method)}</td>
                        <td class="px-4 py-4 text-right font-semibold ${amountColor}">${trx.amount}</td>
                        <td class="px-4 py-4 text-right text-red-amount font-semibold">${trx.charge} ${trx.charge.includes('EUR') ? 'EUR' : 'USD'}</td>
                        <td class="px-4 py-4 text-right text-white font-semibold">${trx.payable}</td>
                        <td class="px-4 py-4 text-center">
                            <span class="${statusClass} text-xs font-semibold px-3 py-1 rounded-full">${trx.status}</span>
                        </td>
                        <td class="px-4 py-4 text-gray-400 text-sm whitespace-nowrap">${trx.date}</td>
                        <td class="px-4 py-4 text-center">${actionContent}</td>
                    </tr>
                `;
                tableBody.insertAdjacentHTML('beforeend', row);
            });
            
            renderPagination();
        }

        function renderPagination() {
            const totalEntries = filteredTransactions.length;
            const totalPages = Math.ceil(totalEntries / entriesPerPage);
            const container = document.getElementById('paginationContainer');
            container.innerHTML = '';
            
            if (totalEntries === 0) return; 

            const startEntry = Math.min((currentPage - 1) * entriesPerPage + 1, totalEntries);
            const endEntry = Math.min(currentPage * entriesPerPage, totalEntries);
            const info = `<p>Showing ${startEntry} to ${endEntry} of ${totalEntries}</p>`;
            
            let pageButtons = '';
            
            // Previous Button
            pageButtons += `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg border border-gray-700 ${currentPage === 1 ? 'text-gray-600 cursor-not-allowed' : 'hover:bg-gray-700 transition duration-150 text-white'}">
                    Prev
                </button>
            `;

            // Page Number Buttons
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                const isActive = i === currentPage ? 'bg-blue-600 text-white' : 'hover:bg-gray-700 text-white';
                pageButtons += `
                    <button onclick="changePage(${i})" class="px-3 py-1.5 rounded-lg border border-gray-700 ${isActive} transition duration-150">
                        ${i}
                    </button>
                `;
            }
            
            // Next Button
            pageButtons += `
                <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg border border-gray-700 ${currentPage === totalPages ? 'text-gray-600 cursor-not-allowed' : 'hover:bg-gray-700 transition duration-150 text-white'}">
                    Next
                </button>
            `;

            container.innerHTML = `
                ${info}
                <div class="flex space-x-2 mt-4 sm:mt-0">
                    ${pageButtons}
                </div>
            `;
        }
        
        function changePage(page) {
            const totalPages = Math.ceil(filteredTransactions.length / entriesPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderTable();
            }
        }
        
        // --- Filter Logic ---

        function parseDate(dateString) {
            // Converts '08 Nov 2025' to a Date object for comparison
            if (!dateString) return null;
            // Handle table date format "DD MMM YYYY"
            const parts = dateString.split(' ');
            return new Date(`${parts[1]} ${parts[0]}, ${parts[2]}`);
        }

        function applyFilters() {
            const searchInput = document.getElementById('searchInput').value.trim().toLowerCase();
            const filterTrxId = document.getElementById('filterTrxId')?.value.trim().toLowerCase();
            const filterStartDate = document.getElementById('filterStartDate')?.value;
            const filterEndDate = document.getElementById('filterEndDate')?.value;
            
            const start = filterStartDate ? new Date(filterStartDate) : null;
            const end = filterEndDate ? new Date(filterEndDate) : null;

            filteredTransactions = allTransactions.filter(trx => {
                let matches = true;

                // 1. General Search (applies to both search input and filter modal ID)
                const searchString = `${trx.id} ${trx.name} ${trx.method} ${trx.status}`.toLowerCase();
                if (searchInput && !searchString.includes(searchInput)) {
                    matches = false;
                }

                // 2. Transaction ID Filter (from modal, if open)
                if (filterTrxId && !trx.id.toLowerCase().includes(filterTrxId)) {
                    matches = false;
                }

                // 3. Date Range Filter (from modal, if open)
                if (start || end) {
                    const trxDate = parseDate(trx.date);
                    if (trxDate) {
                        // Check if transaction date is after the start date
                        if (start && trxDate < start) {
                            matches = false;
                        }
                        // Check if transaction date is before the end date (including the end date)
                        if (end) {
                             const endOfDay = new Date(end);
                             endOfDay.setHours(23, 59, 59, 999);
                             if (trxDate > endOfDay) {
                                matches = false;
                            }
                        }
                    } else {
                        // If date is invalid, exclude it from filter result
                        matches = false;
                    }
                }
                
                return matches;
            });

            // Reset to the first page and re-render
            currentPage = 1;
            renderTable();
            // Only close modal if it's currently open
            if (document.getElementById('filterModal').classList.contains('flex')) {
                toggleModal('filterModal', false);
            }
        }

        function clearFilters() {
            document.getElementById('filterTrxId').value = '';
            document.getElementById('filterStartDate').value = '';
            document.getElementById('filterEndDate').value = '';
            document.getElementById('searchInput').value = '';
            applyFilters();
        }

        // Initialize the components when the page loads
        window.onload = function() {
            renderStats();
            renderTable();
        };
    </script>
  </body>
</html>
