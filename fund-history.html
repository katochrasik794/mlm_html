  <style>
    .min-vh-100 { min-height: 100vh; }
    .card-transition { transition: box-shadow .12s ease, transform .12s ease; }
    .card-transition:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(2,6,23,0.08); }
  </style>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-body);
        }
        .table-container {
            background-color: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
        }
        input[type="text"], select {
            background-color: var(--bg-button);
            border: 1px solid var(--border-card);
            color: var(--text-button);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.15s ease-in-out;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #6366f1;
        }

        @media (max-width: 767px) {
            .mobile-row-item {
                display: flex;
                justify-content: space-between;
                padding-top: 0.4rem;
                padding-bottom: 0.4rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }
            .mobile-row-item:last-child {
                border-bottom: none;
            }
            .mobile-row-item .label {
                font-weight: 500;
                color: var(--text-secondary);
                font-size: 0.875rem;
            }
            .mobile-row-item .value {
                font-weight: 600;
                color: var(--text-body);
                font-size: 0.875rem;
            }
        }
        .pagination-active {
            background-color: #10b981;
            color: white;
            font-weight: bold;
        }

        .main-container::-webkit-scrollbar {
          width: 6px;
        }
        .main-container::-webkit-scrollbar-track {
          background: transparent;
        }
        .main-container::-webkit-scrollbar-thumb {
          background: rgba(0, 0, 0, 0.2);
          border-radius: 4px;
        }
        .main-container::-webkit-scrollbar-thumb:hover {
          background: rgba(0, 0, 0, 0.4);
        }

        .table-container::-webkit-scrollbar {
          height: 4px;
        }
        .table-container::-webkit-scrollbar-track {
          background: transparent;
        }
        .table-container::-webkit-scrollbar-thumb {
          background: rgba(0, 0, 0, 0.2);
          border-radius: 2px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
          background: rgba(0, 0, 0, 0.4);
        }

        html, body {
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            width: 19rem;
        }

        .main-container {
            margin-left: 19rem;
            height: 100vh;
            overflow-y: auto;
        }

        @media (max-width: 1023px) {
            .main-container {
                margin-left: 0;
            }
        }
    </style>

 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
 <link rel="stylesheet" href="style.css">

          <div class="flex items-center gap-4 header-right">

            </button>

                    clip-rule="evenodd"

              </button>

      <main class="main-dashboard  p-6 max-w-7xl mx-auto w-full">
        <div class="max-w-7xl mx-auto">

        <h2 class="text-3xl font-extrabold mb-6 text-white">Fund History</h2>

        <div class="mb-6 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-5">
            <input type="text" id="transaction-id-filter" placeholder="Transaction ID" class="w-full py-3 px-2 text-white bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-700">
            <select id="gateway-filter" class="w-full py-3 px-2 text-white bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-700">
                <option value="">All Payment</option>
                <option value="Stripe">Stripe</option>
                <option value="Paypal">Paypal</option>
                <option value="Blockchain">Blockchain</option>
                <option value="CoinPayments">CoinPayments</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Binance">Binance</option>
                <option value="Nowpayments">Nowpayments</option>
            </select>
            <input type="text" id="date-filter" placeholder="Select a date" class="w-full py-3 px-2 text-white bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-700" onfocus="(this.type='date')" onblur="(this.type='text')">
            <button id="apply-filter" class="w-full py-3 px-2 bg-purple-700 text-gray-600 font-semibold rounded-lg hover:bg-purple-800 transition duration-150 ease-in-out">
                <i class="fas fa-search mr-2"></i> Search
            </button>
            <button id="clear-filter" class="w-full py-3 px-2 bg-gray-600 text-white font-semibold rounded-lg hover:bg-gray-700 transition duration-150 ease-in-out">
                Clear Filter
            </button>
        </div>

        <div class="table-container overflow-x-auto">
            
            <div class="hidden md:block">
                <table class="min-w-full divide-y divide-gray-700">
                    <thead class="table-head">
                        <tr>
                            <th class="px-4 py-6 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-2/12">Transaction ID</th>
                            <th class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-2/12">Gateway</th>
                            <th class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-2/12">Amount</th>
                            <th class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-1/12">Charge</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-1/12">Status</th>
                            <th class="px-4 py-3 text-right text-xs font-medium text-gray-400 uppercase tracking-wider w-2/12">Time</th>
                        </tr>
                    </thead>
                    <tbody id="desktop-table-body" class="divide-y divide-gray-700 table-body"></tbody>
                </table>
            </div>

            <div id="mobile-card-list" class="md:hidden space-y-3"></div>

            <!-- ✅ Fixed Pagination -->
            <div class="py-4 flex justify-center table-body">
                <nav class="flex items-center space-x-1" aria-label="Pagination">
                    <button id="prev-btn" onclick="goToPage(currentPage - 1)" 
                            class="px-3 py-2 text-sm font-medium rounded-lg text-gray-200 transition disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-chevron-left"></i>
                    </button>

                    <div id="page-buttons" class="flex space-x-1"></div>

                    <!-- ✅ Added missing element -->
                    <span id="ellipsis" class="text-gray-400 px-2 hidden sm:inline">...</span>

                    <button id="next-btn" onclick="goToPage(currentPage + 1)" 
                            class="px-3 py-2 text-sm font-medium rounded-lg text-gray-400 transition disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </nav>
            </div>

        </div>

    </div>
    
    
    </div>
      </main>
    </div>
  </div>

  <script src="js/include.js"></script>
  <script src="js/main.js"></script>
  <script>
    const data = [
        { id: "D132418743822", gateway: "CoinPayments", amount: 10989.01, charge: 54.95, status: "Pending", time: "10 Nov 2025 04:12 PM" },
        { id: "D132418743821", gateway: "Blockchain", amount: 5494.50549451, charge: 0.00, status: "Pending", time: "09 Nov 2025 11:30 PM" },
        { id: "D132418743820", gateway: "Paypal", amount: 5494.05, charge: 0.00, status: "Pending", time: "09 Nov 2025 11:16 PM" },
        { id: "D132418743819", gateway: "Paypal", amount: 5494.05, charge: 0.00, status: "Pending", time: "09 Nov 2025 11:16 PM" },
        { id: "D132418743818", gateway: "Paypal", amount: 5494.05, charge: 0.00, status: "Pending", time: "09 Nov 2025 11:16 PM" },
        { id: "D132418743817", gateway: "Blockchain", amount: 5494.505494505, charge: 0.00, status: "Pending", time: "09 Nov 2025 11:02 PM" },
        { id: "D132418743816", gateway: "Bank Transfer", amount: 520.00, charge: 0.50, status: "Pending", time: "09 Nov 2025 11:02 PM" },
        { id: "D132418743815", gateway: "Binance", amount: 37037.03703704, charge: 0.00, status: "Pending", time: "09 Nov 2025 01:23 PM" },
        { id: "D132418743814", gateway: "Blockchain", amount: 5494.50549451, charge: 0.00, status: "Pending", time: "09 Nov 2025 01:22 PM" },
        { id: "D132418743813", gateway: "Nowpayments", amount: 1098.9010989, charge: 0.00, status: "Pending", time: "09 Nov 2025 01:40 AM" },
        { id: "D132418743812", gateway: "Nowpayments", amount: 6043.95604396, charge: 0.00, status: "Pending", time: "08 Nov 2025 12:31 PM" },
        { id: "D132418743811", gateway: "Stripe", amount: 500.00, charge: 3.00, status: "Complete", time: "08 Nov 2025 04:57 AM" },
        { id: "D132418743810", gateway: "Binance", amount: 750.50, charge: 0.00, status: "Pending", time: "07 Nov 2025 09:15 PM" },
        { id: "D132418743809", gateway: "Paypal", amount: 100.00, charge: 0.00, status: "Pending", time: "07 Nov 2025 08:00 PM" },
        { id: "D132418743808", gateway: "Stripe", amount: 250.00, charge: 1.50, status: "Complete", time: "07 Nov 2025 06:45 PM" },
    ];

    let currentPage = 1;
    const ENTRIES_PER_PAGE = 5;
    let filteredData = data;
    let TOTAL_ENTRIES = data.length;
    let MAX_PAGES = Math.ceil(TOTAL_ENTRIES / ENTRIES_PER_PAGE);
    const DISPLAY_PAGE_LIMIT = 10;

    function getFilteredData() {
        const transactionIdFilter = document.getElementById('transaction-id-filter').value.toLowerCase();
        const gatewayFilter = document.getElementById('gateway-filter').value;
        const dateFilter = document.getElementById('date-filter').value;

        return data.filter(item => {
            const idMatch = !transactionIdFilter || item.id.toLowerCase().includes(transactionIdFilter);
            const gatewayMatch = !gatewayFilter || item.gateway === gatewayFilter;
            const dateMatch = !dateFilter || item.time.includes(dateFilter);
            return idMatch && gatewayMatch && dateMatch;
        });
    }

    function updateFilteredData() {
        filteredData = getFilteredData();
        TOTAL_ENTRIES = filteredData.length;
        MAX_PAGES = Math.ceil(TOTAL_ENTRIES / ENTRIES_PER_PAGE);
        currentPage = 1;
        renderPageButtons();
        goToPage(1);
    }

    function clearFilters() {
        document.getElementById('transaction-id-filter').value = '';
        document.getElementById('gateway-filter').value = '';
        document.getElementById('date-filter').value = '';
        updateFilteredData();
    }

    function formatCurrency(amount) {
        return '$' + parseFloat(amount).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }
    
    function getStatusTag(status) {
        let colorClass = status === "Complete" ? "text-green-500" : "text-yellow-500";
        let colorDot = status === "Complete" ? "bg-green-500" : "bg-yellow-500";
        return `<span class="flex items-center ${colorClass} whitespace-nowrap">
                  <span class="w-2 h-2 mr-1 rounded-full ${colorDot}"></span>${status}</span>`;
    }

    function renderTable(page) {
        const start = (page - 1) * ENTRIES_PER_PAGE;
        const end = start + ENTRIES_PER_PAGE;
        const pageData = filteredData.slice(start, end);
        const desktopBody = document.getElementById('desktop-table-body');
        const mobileList = document.getElementById('mobile-card-list');
        desktopBody.innerHTML = '';
        mobileList.innerHTML = '';

        pageData.forEach(item => {
            desktopBody.insertAdjacentHTML('beforeend', `
                <tr class="hover:bg-gray-700/30 transition duration-150">
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-white font-medium">${item.id}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-300">${item.gateway}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-300">${formatCurrency(item.amount)}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-300">${formatCurrency(item.charge)}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm">${getStatusTag(item.status)}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-right text-gray-300">${item.time}</td>
                </tr>`);

            mobileList.insertAdjacentHTML('beforeend', `
                <div class="p-4 bg-gray-800 rounded-lg shadow-lg space-y-1">
                    <div class="flex justify-between items-center pb-2 border-b border-gray-700/50">
                        <span class="text-xs font-bold text-gray-400">Transaction ID:</span>
                        <span class="text-sm font-semibold text-white">${item.id}</span>
                    </div>
                    <div class="mobile-row-item"><span class="label">Gateway:</span> <span class="value">${item.gateway}</span></div>
                    <div class="mobile-row-item"><span class="label">Amount:</span> <span class="value">${formatCurrency(item.amount)}</span></div>
                    <div class="mobile-row-item"><span class="label">Charge:</span> <span class="value">${formatCurrency(item.charge)}</span></div>
                    <div class="mobile-row-item"><span class="label">Status:</span> ${getStatusTag(item.status)}</div>
                    <div class="mobile-row-item"><span class="label">Time:</span> <span class="value">${item.time}</span></div>
                </div>`);
        });
    }

    function renderPageButtons() {
        const buttonContainer = document.getElementById('page-buttons');
        buttonContainer.innerHTML = '';
        const displayLimit = Math.min(DISPLAY_PAGE_LIMIT, MAX_PAGES);
        for (let i = 1; i <= displayLimit; i++) {
            const btn = document.createElement('button');
            btn.className = 'page-btn px-4 py-2 text-sm font-medium rounded-lg text-gray-200 transition';
            btn.textContent = i;
            btn.onclick = () => goToPage(i);
            buttonContainer.appendChild(btn);
        }
        document.getElementById('ellipsis').classList.toggle('hidden', MAX_PAGES <= displayLimit);
    }

    function updatePaginationControls() {
        document.querySelectorAll('.page-btn').forEach(btn => {
            btn.classList.remove('pagination-active');
            btn.classList.add('text-gray-400');
            if (parseInt(btn.textContent) === currentPage) {
                btn.classList.add('pagination-active');
                btn.classList.remove('text-gray-400');
            }
        });
        document.getElementById('prev-btn').disabled = currentPage === 1;
        document.getElementById('next-btn').disabled = currentPage === MAX_PAGES;
    }

    function goToPage(page) {
        if (page < 1 || page > MAX_PAGES) return;
        currentPage = page;
        renderTable(currentPage);
        updatePaginationControls();
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateFilteredData();
        document.getElementById('apply-filter').addEventListener('click', updateFilteredData);
        document.getElementById('clear-filter').addEventListener('click', clearFilters);
    });
  </script>
