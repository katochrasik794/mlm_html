<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Leads - CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .min-vh-100 {
        min-height: 100vh;
      }
      .card-transition {
        transition: box-shadow 0.12s ease, transform 0.12s ease;
      }
      .card-transition:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(2, 6, 23, 0.08);
      }
    </style>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap");
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-body);
      }
      .table-container {
        background-color: var(--bg-card);
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2),
          0 4px 6px -2px rgba(0, 0, 0, 0.1);
      }
      input[type="text"],
      select {
        background-color: var(--bg-body);
        border: 1px solid var(--border-card);
        color: var(--text-button);
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        transition: all 0.15s ease-in-out;
      }
      select:focus,
      input:focus {
        outline: none;
        border-color: #6366f1;
      }

      /* Custom mobile row styling */
      @media (max-width: 767px) {
        .mobile-card {
          padding: 1rem;
          background-color: var(--bg-card);
          border-radius: 0.75rem;
          border: 1px solid var(--border-card);
        }
        .mobile-row-item {
          display: flex;
          justify-content: space-between;
          padding-top: 0.4rem;
          padding-bottom: 0.4rem;
        }
        .mobile-row-item .label {
          font-weight: 500;
          color: var(--text-secondary);
          font-size: 0.875rem;
        }
        .mobile-row-item .value {
          font-weight: 600;
          font-size: 0.875rem;
          text-align: right;
        }
      }
      .pagination-active {
        background-color: #10b981; /* green-500 for active state */
        color: white;
        font-weight: bold;
      }

      html,
      body {
        height: 100vh;
        overflow: hidden;
      }

      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        overflow-y: auto;
        width: 19rem;
      }

      .main-container {
        margin-left: 19rem;
        height: 100vh;
        overflow-y: auto;
      }

      @media (max-width: 1023px) {
        .main-container {
          margin-left: 0;
        }
      }

      /* Sidebar toggle styles */
      body.sidebar-hidden #sidebar {
        transform: translateX(-100%);
      }

      body.sidebar-hidden .main-dashboard {
        margin-left: 0 !important;
      }

      body.sidebar-hidden .topbar .max-w-7xl {
        max-width: none !important;
      }

      #sidebar {
        transition: transform 1s ease;
      }

      .main-dashboard {
        transition: margin-left 1s ease;
      }

      /* Scrollbar styling for main container */
      .main-container::-webkit-scrollbar {
        width: 6px;
      }
      .main-container::-webkit-scrollbar-track {
        background: transparent;
      }
      .main-container::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
      }
      .main-container::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.4);
      }

      /* Scrollbar styling for table */
      .table-container::-webkit-scrollbar {
        height: 4px;
      }
      .table-container::-webkit-scrollbar-track {
        background: transparent;
      }
      .table-container::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 2px;
      }
      .table-container::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.4);
      }
    </style>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="antialiased">
    <div>
      <div data-include="components/sidebar.html"></div>

      <!-- main column: topbar + page content + footer -->
      <div class="main-container main-dashboard flex-col">
        <!-- topbar -->
        <header class="topbar p-4 text-white ml-6 mr-6 mt-10 rounded-xl">
        <div class="mx-auto flex items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <!-- Mobile menu button -->
            <button id="mobileToggle" class="lg:hidden p-2 rounded-md">
              <svg
                class="w-5 h-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                class=""
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                  class=""
                />
              </svg>
            </button>
            <!-- Desktop hamburger menu button -->
            <button id="desktopToggle" class="hidden lg:block p-2 rounded-md">
              <svg
                class="w-5 h-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
            </button>
          </div>

          <div class="flex items-center gap-4 header-right">
            <button
              id="themeToggle"
              class="p-3 w-12 h-12 rounded-lg flex items-center justify-center text-slate-700 transition"
            >
              <svg
                id="themeIcon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-moon"
              >
                <path
                  d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                  class=""
                />
              </svg>
            </button>
            <div class="relative">
              <button
                id="profileBtn"
                class="flex items-center gap-2 p-1 rounded-md hover:bg-gray-600"
              >
                <img
                  src="https://i.pravatar.cc/40"
                  alt="avatar"
                  class="w-8 h-8 rounded-full"
                />
                <span class="hidden sm:block text-sm">Raghav</span>
                <svg
                  class="w-4 h-4"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                  class=""
                >
                  <path
                    fill-rule="evenodd"
                    d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z"
                    clip-rule="evenodd"
                    class=""
                  />
                </svg>
              </button>

              <!-- Profile dropdown -->
              <div
                id="profileDropdown"
                class="hidden absolute right-0 mt-2 w-44 py-1"
              >
              <a href="index.html" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >Dashboard</a
                >
                <a href="profile.html" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >My Profile</a
                >
                <a href="two-factor.html" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >2FA Security</a
                >
                <a href="#" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >logout out</a
                >
              </div>
            </div>
          </div>
        </div>
      </header>

        <!-- page-specific content -->
        <main class="main-dashboard p-6 mx-auto w-full">
          <div class="mx-auto">
            <!-- Title -->
            <h2 class="text-3xl font-extrabold mb-6 text-white">
              Referral Bonus
            </h2>

            <!-- Filter Bar -->
            <div class="mb-6">
              <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-0">
                  <label for="filter-from" class="block text-sm font-medium text-gray-300 mb-1">Bonus From</label>
                  <input type="text" id="filter-from" class="w-full px-3 py-2  border border-gray-600 rounded-md text-white" placeholder="Filter by bonus from">
                </div>
                <div class="flex-1 min-w-0">
                  <label for="filter-amount" class="block text-sm font-medium text-gray-300 mb-1">Amount</label>
                  <input type="text" id="filter-amount" class="w-full px-3 py-2  border border-gray-600 rounded-md text-white" placeholder="Filter by amount">
                </div>
                <div class="flex-1 min-w-0">
                  <label for="filter-date" class="block text-sm font-medium text-gray-300 mb-1">Select a date</label>
                  <input type="date" id="filter-date" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-white">
                </div>
                <button id="apply-filter" class="px-4 py-3 bg-purple-700 text-gray-600 rounded-md hover:bg-purple-800">Apply Filter</button>
                <button id="clear-filter" class="px-4 py-3 bg-purple-700 text-gray-600 rounded-md hover:bg-purple-800">Clear Filter</button>
              </div>
            </div>

            <!-- Table Container -->
            <div class="table-container overflow-x-auto">
              <!-- Standard Table for Desktop/Tablet (md and up) -->
              <div class="hidden md:block">
                <table class="min-w-full divide-y divide-gray-700">
                  <thead class="table-head">
                    <tr>
                      <th
                        class="px-4 py-6 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-1/12"
                      >
                        SL No.
                      </th>
                      <th
                        class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-2/12"
                      >
                        Bonus From
                      </th>
                      <th
                        class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-2/12"
                      >
                        Amount
                      </th>
                      <th
                        class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-4/12"
                      >
                        Remarks
                      </th>
                      <th
                        class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-3/12"
                      >
                        Time
                      </th>
                    </tr>
                  </thead>
                  <tbody
                    id="desktop-table-body"
                    class="divide-y divide-gray-700 table-body"
                  >
                    <!-- Table rows will be inserted here by JavaScript -->
                  </tbody>
                </table>
              </div>

              <!-- Card List for Mobile (less than md) -->
              <div id="mobile-card-list" class="md:hidden space-y-4">
                <!-- Mobile cards will be inserted here by JavaScript -->
              </div>

              <!-- Pagination Bar -->
              <div class="py-4 flex justify-center table-body">
                <nav
                  class="flex items-center space-x-1"
                  aria-label="Pagination"
                >
                  <button
                    id="prev-btn"
                    onclick="goToPage(currentPage - 1)"
                    class="px-3 py-2 text-sm font-medium rounded-lg text-gray-200 transition disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    <i class="fas fa-chevron-left"></i>
                  </button>

                  <!-- Page Buttons will be created dynamically -->

                  <!-- Inactive/Placeholder Buttons -->
                  <!-- <span class="text-gray-200 px-2 hidden sm:inline">...</span>
                  <button
                    class="px-4 py-2 text-sm font-medium rounded-lg text-gray-200 transition hidden sm:inline"
                    disabled
                  >
                    30
                  </button> -->

                  <button
                    id="next-btn"
                    onclick="goToPage(currentPage + 1)"
                    class="px-3 py-2 text-sm font-medium rounded-lg text-gray-200 transition disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    <i class="fas fa-chevron-right"></i>
                  </button>
                </nav>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- load includes and UI script -->
    <script src="js/include.js"></script>
    <script src="js/main.js"></script>
    <script>
      // Desktop sidebar toggle
      document.getElementById('desktopToggle').addEventListener('click', function() {
        document.body.classList.toggle('sidebar-hidden');
      });
    </script>
    <script>
      // ---------- CONFIG & DATA ----------
      const ENTRIES_PER_PAGE = 5; // <<-- moved here (must be declared BEFORE computing pages)

      const data = [
        { id: 1, from: "Aaron Smith", amount: "$3.00000000", remarks: "Level 1 Referral Bonus From Aaronsmith0104", time: "01 Nov 2024 08:02 PM" },
        { id: 2, from: "Roman Novikov", amount: "$0.05000000", remarks: "Level 1 Referral Bonus From Romarioone", time: "01 Nov 2024 07:40 PM" },
        { id: 3, from: "Aaron Smith", amount: "$3.00000000", remarks: "Level 1 Referral Bonus From Aaronsmith0104", time: "01 Nov 2024 01:50 AM" },
        { id: 4, from: "Sha Mende", amount: "$0.30000000", remarks: "Level 2 Referral Bonus From Mendsga", time: "31 Oct 2024 01:32 AM" },
        { id: 5, from: "Roman Novikov", amount: "$0.05000000", remarks: "Level 1 Referral Bonus From Romarioone", time: "29 Oct 2024 07:22 AM" },
        { id: 6, from: "Aaron Smith", amount: "$5.99400000", remarks: "Level 1 Referral Bonus From Aaronsmith0104", time: "28 Oct 2024 11:08 PM" },
        { id: 7, from: "Appexin Appexin", amount: "$3.00000000", remarks: "Level 1 Referral Bonus From Appexin", time: "28 Oct 2024 03:14 AM" },
        { id: 8, from: "Patricia Lebsack", amount: "$0.72000000", remarks: "Level 1 Referral Bonus From Karianne", time: "26 Oct 2024 07:58 PM" },
        { id: 9, from: "Kwabena Appoh", amount: "$0.60000000", remarks: "Level 1 Referral Bonus From Matech", time: "25 Oct 2024 03:50 AM" },
        { id: 10, from: "Leanne Graham", amount: "$0.60000000", remarks: "Level 1 Referral Bonus From Bret", time: "24 Oct 2024 12:22 PM" },
        { id: 11, from: "Appexin18 Appexin18", amount: "$0.15000000", remarks: "Level 2 Referral Bonus From Appexin18", time: "23 Oct 2024 10:02 AM" },
        { id: 12, from: "Appexin Appexin", amount: "$0.60000000", remarks: "Level 1 Referral Bonus From Appexin", time: "23 Oct 2024 07:48 AM" },
        { id: 13, from: "New Referrer", amount: "$1.00000000", remarks: "Level 1 Referral Bonus From UserX", time: "22 Oct 2024 09:00 PM" },
        { id: 14, from: "Another User", amount: "$0.50000000", remarks: "Level 2 Referral Bonus From TestUser", time: "21 Oct 2024 05:30 PM" },
        { id: 15, from: "Final Test", amount: "$2.00000000", remarks: "Level 1 Referral Bonus From FinalRef", time: "20 Oct 2024 04:00 AM" }
      ];

      // ---------- STATE ----------
      let filteredData = [...data];
      let currentPage = 1;
      let totalPages = Math.max(1, Math.ceil(filteredData.length / ENTRIES_PER_PAGE));

      // ---------- RENDER ----------
      function renderTable(page) {
        const start = (page - 1) * ENTRIES_PER_PAGE;
        const end = start + ENTRIES_PER_PAGE;
        const pageData = filteredData.slice(start, end);

        const desktopBody = document.getElementById("desktop-table-body");
        const mobileList = document.getElementById("mobile-card-list");

        desktopBody.innerHTML = "";
        mobileList.innerHTML = "";

        if (pageData.length === 0) {
          // Show "no results" row for desktop
          const noRow = `
            <tr>
              <td colspan="5" class="px-4 py-6 text-center text-sm text-gray-400">No records found</td>
            </tr>
          `;
          desktopBody.insertAdjacentHTML("beforeend", noRow);
          // Show "no results" card for mobile
          const noCard = `<div class="mobile-card"><div class="text-center text-gray-400 py-4">No records found</div></div>`;
          mobileList.insertAdjacentHTML("beforeend", noCard);
          return;
        }

        pageData.forEach((item) => {
          const amountClass = "text-green-500 font-semibold";

          const desktopRow = `
                <tr class="hover:bg-gray-700/30 transition duration-150">
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-400">${item.id}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-white font-medium">${item.from}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm ${amountClass}">${item.amount}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-300">${item.remarks}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-300">${item.time}</td>
                </tr>
            `;
          desktopBody.insertAdjacentHTML("beforeend", desktopRow);

          const mobileCard = `
                <div class="mobile-card space-y-1">
                    <div class="flex justify-between items-center pb-2 border-b border-gray-700/50 mb-1">
                        <span class="text-sm font-bold text-white">${item.id}. ${item.from}</span>
                        <div class="text-right text-sm ${amountClass}">${item.amount}</div>
                    </div>
                    <div class="mobile-row-item"><span class="label">Remarks:</span> <span class="value text-gray-300">${item.remarks}</span></div>
                    <div class="mobile-row-item"><span class="label">Time:</span> <span class="value text-gray-300">${item.time}</span></div>
                </div>
            `;
          mobileList.insertAdjacentHTML("beforeend", mobileCard);
        });
      }

      function formatDate(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        if (isNaN(date)) return '';
        const day = String(date.getDate()).padStart(2, '0');
        const month = date.toLocaleString('en', { month: 'short' });
        const year = date.getFullYear();
        return `${day} ${month} ${year}`;
      }

      // ---------- FILTER ----------
      function applyFilter() {
        const from = document.getElementById('filter-from').value.trim().toLowerCase();
        const amount = document.getElementById('filter-amount').value.trim().toLowerCase();
        const date = document.getElementById('filter-date').value;
        const dateFormatted = formatDate(date).toLowerCase();

        if (!from && !amount && !date) {
          filteredData = [...data];
        } else {
          filteredData = data.filter(item => {
            const fromMatch = from ? item.from.toLowerCase().includes(from) : false;
            const amountMatch = amount ? item.amount.toLowerCase().includes(amount) : false;
            const dateMatch = date ? item.time.toLowerCase().includes(dateFormatted) : false;
            return fromMatch || amountMatch || dateMatch;
          });
        }

        totalPages = Math.max(1, Math.ceil(filteredData.length / ENTRIES_PER_PAGE));
        goToPage(1);
      }

      function clearFilter() {
        document.getElementById('filter-from').value = '';
        document.getElementById('filter-amount').value = '';
        document.getElementById('filter-date').value = '';
        filteredData = [...data];
        totalPages = Math.max(1, Math.ceil(filteredData.length / ENTRIES_PER_PAGE));
        goToPage(1);
      }

      // ---------- PAGINATION ----------
      function updatePaginationControls() {
        // Remove existing page buttons
        document.querySelectorAll('.page-btn').forEach(btn => btn.remove());

        // Get nav
        const nav = document.querySelector('nav[aria-label="Pagination"]');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // Safety: ensure totalPages is at least 1
        totalPages = Math.max(1, totalPages);

        // Insert page buttons BEFORE nextBtn
        for(let i = 1; i <= totalPages; i++){
          const btn = document.createElement('button');
          btn.className = 'page-btn px-4 py-2 text-sm font-medium rounded-lg text-gray-200 transition';
          btn.textContent = i;
          btn.onclick = () => goToPage(i);
          nav.insertBefore(btn, nextBtn);
        }

        // Update active button styling
        document.querySelectorAll(".page-btn").forEach((btn) => {
          btn.classList.remove("pagination-active");
          btn.classList.remove("text-gray-400");
          btn.classList.add("text-gray-200");
          if (parseInt(btn.textContent) === currentPage) {
            btn.classList.add("pagination-active");
            btn.classList.remove("text-gray-200");
          }
        });

        // Update Prev/Next button disabled state
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage === totalPages;
      }

      function goToPage(page) {
        // Recompute totalPages (in case filteredData changed)
        totalPages = Math.max(1, Math.ceil(filteredData.length / ENTRIES_PER_PAGE));

        // Boundary check
        if (page < 1) page = 1;
        if (page > totalPages) page = totalPages;

        currentPage = page;
        renderTable(currentPage);
        updatePaginationControls();
      }

      // ---------- INIT ----------
      window.onload = () => {
        // initial pagination values
        totalPages = Math.max(1, Math.ceil(filteredData.length / ENTRIES_PER_PAGE));
        goToPage(1);

        // Attach handlers (safe to attach now)
        document.getElementById('apply-filter').addEventListener('click', applyFilter);
        document.getElementById('clear-filter').addEventListener('click', clearFilter);
      };

      // If scripts are executed before DOM ready, below would fail, but we attached in onload above.
    </script>
  </body>
</html>
