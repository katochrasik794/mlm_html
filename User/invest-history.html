<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Leads - CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .min-vh-100 { min-height: 100vh; }
    .card-transition { transition: box-shadow .12s ease, transform .12s ease; }
    .card-transition:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(2,6,23,0.08); }
  </style>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-body);
        }
        .table-container {
            background-color: var(--bg-table);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
        }

        /* Custom mobile row styling */
        @media (max-width: 767px) {
            .mobile-card {
                padding: 1rem;
                background-color: var(--bg-card);
                border-radius: 0.75rem;
                border: 1px solid var(--border-card);
            }
            .mobile-row-item {
                display: flex;
                justify-content: space-between;
                padding-top: 0.4rem;
                padding-bottom: 0.4rem;
            }
            .mobile-row-item .label {
                font-weight: 500;
                color: var(--text-secondary);
                font-size: 0.875rem;
            }
            .mobile-row-item .value {
                font-weight: 600;
                font-size: 0.875rem;
                text-align: right;
            }
        }
        .pagination-active {
            background-color: #10b981; /* green-500 for active state */
            color: white;
            font-weight: bold;
        }
        .status-dot {
          display: inline-block;
          width: 8px;
          height: 8px;
          border-radius: 50%;
          margin-right: 6px;
        }

        /* Scrollbar styling for main container */
        .main-container::-webkit-scrollbar {
          width: 6px;
        }
        .main-container::-webkit-scrollbar-track {
          background: transparent;
        }
        .main-container::-webkit-scrollbar-thumb {
          background: rgba(0, 0, 0, 0.2);
          border-radius: 4px;
        }
        .main-container::-webkit-scrollbar-thumb:hover {
          background: rgba(0, 0, 0, 0.4);
        }

        html, body {
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            width: 19rem;
        }

        .main-container {
            margin-left: 19rem;
            height: 100vh;
            overflow-y: auto;
        }

        @media (max-width: 1023px) {
            .main-container {
                margin-left: 0;
            }
        }

        /* Sidebar toggle styles */
        body.sidebar-hidden #sidebar {
          transform: translateX(-100%);
        }

        body.sidebar-hidden .main-dashboard {
          margin-left: 0 !important;
        }

        body.sidebar-hidden .topbar .max-w-7xl {
          max-width: none !important;
        }

        #sidebar {
          transition: transform 1s ease;
        }

        .main-dashboard {
          transition: margin-left 1s ease;
        }
    </style>

 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
 <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-slate-900 antialiased">

  <div class="fle">

    <div data-include="components/sidebar.html"></div>

    <!-- main column: topbar + page content + footer -->
    <div class="main-container main-dashboard flex flex-col">
      <!-- topbar -->

        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <!-- Mobile menu button -->
            <button id="mobileToggle" class="lg:hidden p-2 rounded-md">
              <svg
                class="w-5 h-5"

                stroke="currentColor"
                class=""
              >
                <path
                  stroke-linecap="round"

                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                  class=""
                />
              </svg>
            </button>
            <!-- Desktop hamburger menu button -->
            <button id="desktopToggle" class="hidden lg:block p-2 rounded-md">
              <svg
                class="w-5 h-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"

          <div class="flex items-center gap-4 header-right">

            </button>
            <div class="relative">

                <span class="hidden sm:block text-sm">Raghav</span>
                <svg

                >
                  <path
                    fill-rule="evenodd"
                    d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z"
                    clip-rule="evenodd"
                    class=""
                  />
                </svg>
              </button>

              <!-- Profile dropdown -->
              <div
                id="profileDropdown"
                class="hidden absolute right-0 mt-2 w-44 py-1"
              >
              <a href="index.html" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >Dashboard</a
                >
                <a href="profile.html" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >My Profile</a
                >
                <a href="two-factor.html" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >2FA Security</a
                >
                <a href="#" class="block px-3 py-2 text-sm hover:bg-gray-600"

                >
              </div>
            </div>
          </div>
        </div>

      <!-- page-specific content -->
      <main class="main-dashboard  p-6 max-w-7xl mx-auto w-full">
        <div class="max-w-7xl mx-auto">

        <h2 class="text-3xl font-extrabold mb-6 text-white">Invest History</h2>

        <!-- Filter Bar -->
        <div class="mb-6 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-5">
          <input type="text" id="plan-filter" placeholder="Filter by Plan" class="w-full py-3 px-2 text-white bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-700">
          <input type="text" id="interest-filter" placeholder="Filter by Return Interest" class="w-full py-3 px-2 text-white bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-700">
          <input type="text" id="status-filter" placeholder="Filter by Upcoming Payment" class="w-full py-3 px-2 text-white bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-700">
          <button id="apply-filter" class="w-full py-3 px-2 bg-purple-700 text-gray-600 font-semibold rounded-lg hover:bg-purple-800 transition duration-150 ease-in-out">
            Apply Filter
          </button>
          <button id="clear-filter" class="w-full py-3 px-2 bg-gray-600 text-white font-semibold rounded-lg hover:bg-gray-700 transition duration-150 ease-in-out">
            Clear Filter
          </button>
        </div>

        <div class="table-container overflow-x-auto">
            
            <div class="hidden md:block">
                <table class="min-w-full divide-y divide-gray-700">
                    <thead class="table-head">
                        <tr>
                            <th class=" px-4 py-6 text-left text-xs font-medium  uppercase tracking-wider w-1/12">SL</th>
                            <th class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-3/12">Plan</th>
                            <th class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-3/12">Return Interest</th>
                            <th class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-3/12">Received Amount</th>
                            <th class="px-4 py-4 text-right text-xs font-medium text-gray-400 uppercase tracking-wider w-2/12">Upcoming Payment</th>
                        </tr>
                    </thead>
                    <tbody id="desktop-table-body" class="table-body  divide-gray-700">
                        </tbody>
                </table>
            </div>

            <div id="mobile-card-list" class="md:hidden space-y-4">
                </div>

            <div class="py-4 flex justify-center table-body">
                <nav class="flex items-center space-x-1" aria-label="Pagination">
                    <button id="prev-btn" onclick="goToPage(currentPage - 1)" 
                            class="px-3 py-2 text-sm font-medium rounded-lg text-gray-400 hover:bg-gray-700/50 transition disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    
                    <div id="page-buttons" class="flex space-x-1">
                        </div>

                    <span id="ellipsis" class="text-gray-400 px-2">...</span>
                    <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-400 transition" disabled>10</button>

                    <button id="next-btn" onclick="goToPage(currentPage + 1)" 
                            class="px-3 py-2 text-sm font-medium rounded-lg text-gray-400 hover:bg-gray-700/50 transition disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </nav>
            </div>

        </div>

    </div>
    
      </main>
    </div>
  </div>

  <!-- load includes and UI script -->
  <script src="js/include.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Desktop sidebar toggle
    document.getElementById('desktopToggle').addEventListener('click', function() {
      document.body.classList.toggle('sidebar-hidden');
    });
  </script>

  <script>
    // Mock data (20 entries to ensure at least 4 working pages at 5 entries/page)
    const mockData = [
        // Page 1 (1-5)
        { plan: "Hatchling Plan", price: "$120.00", interest: "$7.20 Per Day", received: "31 X 7.20 = $223.2", status: "Terminated" },
        { plan: "Baby Plan", price: "$100.00", interest: "$6.00 Per Day", received: "32 X 6.00 = $192", status: "Time Has Passed" },
        { plan: "Baby Plan", price: "$100.00", interest: "$6.00 Per Day", received: "720 X 6.00 = $4320", status: "Completed" },
        { plan: "Secondary Pack", price: "$100.00", interest: "$6.00 Per Day", received: "32 X 6.00 = $192", status: "Time Has Passed" },
        { plan: "Primary Pack", price: "$500.00", interest: "$6.00 Per Day", received: "34 X 6.00 = $204", status: "Time Has Passed" },
        // Page 2 (6-10)
        { plan: "Hatchling Plan", price: "$100.00", interest: "$6.00 Per Day", received: "720 X 6.00 = $4320", status: "Completed" },
        { plan: "Starter Pack", price: "$500.00", interest: "$6.00 Per Day", received: "34 X 6.00 = $204", status: "Time Has Passed" },
        { plan: "Hatchling Plan", price: "$120.00", interest: "$7.20 Per Day", received: "32 X 7.20 = $230.4", status: "Time Has Passed" },
        { plan: "Starter Pack", price: "$500.00", interest: "$6.00 Per Day", received: "34 X 6.00 = $204", status: "Time Has Passed" },
        { plan: "Baby Plan", price: "$120.00", interest: "$6.00 Per Day", received: "1 X 6.00 = $6", status: "Completed" },
        // Page 3 (11-15)
        { plan: "Mega Plan", price: "$200.00", interest: "$10.00 Per Day", received: "50 X 10.00 = $500", status: "Completed" },
        { plan: "Mini Pack", price: "$50.00", interest: "$3.00 Per Day", received: "10 X 3.00 = $30", status: "Terminated" },
        { plan: "Business Plan", price: "$1000.00", interest: "$60.00 Per Day", received: "1 X 60.00 = $60", status: "Time Has Passed" },
        { plan: "Hatchling Plan", price: "$120.00", interest: "$7.20 Per Day", received: "10 X 7.20 = $72", status: "Time Has Passed" },
        { plan: "Starter Pack", price: "$400.00", interest: "$4.00 Per Day", received: "5 X 4.00 = $20", status: "Completed" },
        // Page 4 (16-20)
        { plan: "Secondary Pack", price: "$100.00", interest: "$6.00 Per Day", received: "10 X 6.00 = $60", status: "Time Has Passed" },
        { plan: "Primary Pack", price: "$500.00", interest: "$6.00 Per Day", received: "10 X 6.00 = $60", status: "Time Has Passed" },
        { plan: "Hatchling Plan", price: "$120.00", interest: "$7.20 Per Day", received: "5 X 7.20 = $36", status: "Terminated" },
        { plan: "Mega Plan", price: "$200.00", interest: "$10.00 Per Day", received: "1 X 10.00 = $10", status: "Completed" },
        { plan: "Mini Pack", price: "$50.00", interest: "$3.00 Per Day", received: "20 X 3.00 = $60", status: "Time Has Passed" },
    ];


    let currentPage = 1;
    const ENTRIES_PER_PAGE = 5; // MODIFIED to 5 as requested
    let filteredData = mockData; // Will hold the filtered data
    let TOTAL_ENTRIES = mockData.length;
    let MAX_PAGES = Math.ceil(TOTAL_ENTRIES / ENTRIES_PER_PAGE);
    const DISPLAY_PAGE_LIMIT = 10; // Display up to 10 buttons

    function getFilteredData() {
        const planFilter = document.getElementById('plan-filter').value.toLowerCase();
        const interestFilter = document.getElementById('interest-filter').value.toLowerCase();
        const statusFilter = document.getElementById('status-filter').value.toLowerCase();

        return mockData.filter(item => {
            const planMatch = !planFilter || item.plan.toLowerCase().includes(planFilter);
            const interestMatch = !interestFilter || item.interest.toLowerCase().includes(interestFilter);
            const statusMatch = !statusFilter || item.status.toLowerCase().includes(statusFilter);
            return planMatch && interestMatch && statusMatch;
        });
    }

    function updateFilteredData() {
        filteredData = getFilteredData();
        TOTAL_ENTRIES = filteredData.length;
        MAX_PAGES = Math.ceil(TOTAL_ENTRIES / ENTRIES_PER_PAGE);
        currentPage = 1; // Reset to first page when filtering
        renderPageButtons();
        goToPage(1);
    }

    function clearFilters() {
        document.getElementById('plan-filter').value = '';
        document.getElementById('interest-filter').value = '';
        document.getElementById('status-filter').value = '';
        updateFilteredData();
    }

    function getStatusBadge(status) {
        let dotColor = '';
        let textColor = '';
        if (status === 'Terminated') {
            dotColor = 'bg-red-500';
            textColor = 'text-red-400';
        } else if (status === 'Completed') {
            dotColor = 'bg-green-500';
            textColor = 'text-green-400';
        } else {
             dotColor = 'bg-gray-400';
            textColor = 'text-gray-400';
        }
        return `
            <span class="flex items-center justify-end text-sm ${textColor} font-medium whitespace-nowrap">
                <span class="status-dot ${dotColor}"></span>
                ${status}
            </span>
        `;
    }

    function renderTable(page) {
        const start = (page - 1) * ENTRIES_PER_PAGE;
        const end = start + ENTRIES_PER_PAGE;
        const pageData = filteredData.slice(start, end);

        const desktopBody = document.getElementById('desktop-table-body');
        const mobileList = document.getElementById('mobile-card-list');

        desktopBody.innerHTML = '';
        mobileList.innerHTML = '';

        pageData.forEach((item, index) => {
            const serialNumber = start + index + 1;
            const statusHtml = getStatusBadge(item.status);

            // --- Desktop Row (TR) ---
            const desktopRow = `
                <tr class="hover:bg-gray-700/30 transition duration-150">
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-400">${serialNumber}</td>
                    <td class="px-4 py-3 whitespace-normal text-sm text-white font-medium">${item.plan}<span class="text-xs text-gray-500 block">${item.price}</span></td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-green-500 font-mono">${item.interest}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-white font-medium">${item.received}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-right">${statusHtml}</td>
                </tr>
            `;
            desktopBody.insertAdjacentHTML('beforeend', desktopRow);

            // --- Mobile Card (DIV) ---
            const mobileCard = `
                <div class="mobile-card space-y-1">
                    <div class="flex justify-between items-start pb-2 border-b border-gray-700/50 mb-1">
                        <span class="text-sm font-bold text-white pr-2">${serialNumber}. ${item.plan} <span class="text-gray-400 font-normal">(${item.price})</span></span>
                        <div class="text-right text-sm whitespace-nowrap">${getStatusBadge(item.status)}</div>
                    </div>
                    <div class="mobile-row-item"><span class="label">Return Interest:</span> <span class="value text-lime-400 font-mono">${item.interest}</span></div>
                    <div class="mobile-row-item"><span class="label">Received Amount:</span> <span class="value text-white">${item.received}</span></div>
                </div>
            `;
            mobileList.insertAdjacentHTML('beforeend', mobileCard);
        });
    }

    function renderPageButtons() {
        const buttonContainer = document.getElementById('page-buttons');
        buttonContainer.innerHTML = '';

        const displayLimit = Math.min(DISPLAY_PAGE_LIMIT, MAX_PAGES);
        for (let i = 1; i <= displayLimit; i++) {
            const btn = document.createElement('button');
            btn.className = 'page-btn px-4 py-2 text-sm font-medium rounded-lg text-gray-200  transition';
            btn.textContent = i;
            btn.onclick = () => goToPage(i);
            buttonContainer.appendChild(btn);
        }
        // Only show ellipsis if we have more pages than we explicitly display (e.g., more than 10 pages)
        document.getElementById('ellipsis').classList.toggle('hidden', MAX_PAGES <= displayLimit);
    }

    function updatePaginationControls() {
        // Update active button styling
        document.querySelectorAll('.page-btn').forEach(btn => {
            btn.classList.remove('pagination-active', 'text-gray-400');
            btn.classList.add('text-gray-400');
            if (parseInt(btn.textContent) === currentPage) {
                btn.classList.add('pagination-active');
                btn.classList.remove('text-gray-400');
            }
        });

        // Update Prev/Next button disabled state
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // Note: MAX_PAGES is the true maximum based on mock data length
        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= MAX_PAGES; 
    }

    function goToPage(page) {
        if (page < 1 || page > MAX_PAGES) {
            return;
        }
        currentPage = page;
        renderTable(currentPage);
        updatePaginationControls();
    }

    // Initialize the dashboard on load
    window.onload = () => {
        renderPageButtons();
        goToPage(1); // Load the first page

        // Add event listeners for filter buttons
        document.getElementById('apply-filter').addEventListener('click', updateFilteredData);
        document.getElementById('clear-filter').addEventListener('click', clearFilters);
    };
</script>
</body>
