<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Leads - CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .min-vh-100 {
        min-height: 100vh;
      }
      .card-transition {
        transition: box-shadow 0.12s ease, transform 0.12s ease;
      }
      .card-transition:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(2, 6, 23, 0.08);
      }
    </style>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap");
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-body);
      }
      .main-container {
        background-color: var(--bg-card);
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2),
          0 4px 6px -2px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      input[type="text"],
      input[type="email"],
      input[type="tel"],
      input[type="password"],
      select,
      textarea {
        background-color: var(--bg-button);
        border: 1px solid var(--border-card);
        color: var(--text-button);
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        transition: all 0.15s ease-in-out;
        width: 100%;
      }
      select:focus,
      input:focus,
      textarea:focus {
        outline: none;
        border-color: #6366f1;
      }
      .sidebar-link {
        padding: 0.75rem 1rem;
        display: flex;
        align-items: center;
        font-weight: 500;
        color: #94a3b8;
        transition: background-color 0.2s;
      }
      .sidebar-link.active {
        background-color: #374151; /* Darker blue for active state */
        color: #e2e8f0;
        border-left: 3px solid #10b981; /* Lime border */
      }
      .sidebar-link:hover:not(.active) {
        background-color: #1f2937;
      }
      .avatar-upload {
        position: absolute;
        bottom: 0;
        right: 0;
        cursor: pointer;
        width: 30px;
        height: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #10b981; /* Lime green camera icon background */
        border-radius: 50%;
        border: 2px solid #1a202c; /* Border color matches card background */
        color: #0f172a;
      }
      .sidebar-link.active {
        background-color: #374151; /* gray-700 */
        color: #3b82f6; /* blue-500 */
      }

      /* Fade-in animation for content */
      .fade-enter {
        opacity: 0;
        transform: translateY(10px);
      }
      .fade-enter-active {
        opacity: 1;
        transform: translateY(0);
        transition: all 0.3s ease;
      }

      html,
      body {
        height: 100vh;
        overflow: hidden;
      }

      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        overflow-y: auto;
        width: 19rem;
      }

      .layout-main-container {
        margin-left: 19rem;
        height: 100vh;
        overflow-y: auto;
      }

      @media (max-width: 1023px) {
        .layout-main-container {
          margin-left: 0;
        }
      }

      /* Sidebar toggle styles */
      body.sidebar-hidden #sidebar {
        transform: translateX(-100%);
      }

      body.sidebar-hidden .main-dashboard {
        margin-left: 0 !important;
      }

      body.sidebar-hidden .topbar .max-w-7xl {
        max-width: none !important;
      }

      #sidebar {
        transition: transform 1s ease;
      }

      .main-dashboard {
        transition: margin-left 1s ease;
      }

      /* Scrollbar styling for main container */
      .layout-main-container::-webkit-scrollbar {
        width: 6px;
      }
      .layout-main-container::-webkit-scrollbar-track {
        background: transparent;
      }
      .layout-main-container::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
      }
      .layout-main-container::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.4);
      }
    </style>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="antialiased">
    <div>
      <div data-include="components/sidebar.html"></div>

      <!-- main column: topbar + page content + footer -->
      <div class="layout-main-container main-dashboard flex-col">
        <!-- topbar -->
        <header class="topbar p-4 text-white ml-6 mr-6 mt-10 rounded-xl">
        <div class="mx-auto flex items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <!-- Mobile menu button -->
            <button id="mobileToggle" class="lg:hidden p-2 rounded-md">
              <svg
                class="w-5 h-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                class=""
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                  class=""
                />
              </svg>
            </button>
            <!-- Desktop hamburger menu button -->
            <button id="desktopToggle" class="hidden lg:block p-2 rounded-md">
              <svg
                class="w-5 h-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
            </button>
          </div>

          <div class="flex items-center gap-4 header-right">
            <button
              id="themeToggle"
              class="p-3 w-12 h-12 rounded-lg flex items-center justify-center text-slate-700 transition"
            >
              <svg
                id="themeIcon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-moon"
              >
                <path
                  d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                  class=""
                />
              </svg>
            </button>
            <div class="relative">
              <button
                id="profileBtn"
                class="flex items-center gap-2 p-1 rounded-md hover:bg-gray-600"
              >
                <img
                  src="https://i.pravatar.cc/40"
                  alt="avatar"
                  class="w-8 h-8 rounded-full"
                />
                <span class="hidden sm:block text-sm">Raghav</span>
                <svg
                  class="w-4 h-4"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                  class=""
                >
                  <path
                    fill-rule="evenodd"
                    d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z"
                    clip-rule="evenodd"
                    class=""
                  />
                </svg>
              </button>

              <!-- Profile dropdown -->
              <div
                id="profileDropdown"
                class="hidden absolute right-0 mt-2 w-44 py-1"
              >
              <a href="index.html" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >Dashboard</a
                >
                <a href="profile.html" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >My Profile</a
                >
                <a href="two-factor.html" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >2FA Security</a
                >
                <a href="#" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >logout out</a
                >
              </div>
            </div>
          </div>
        </div>
      </header>

        <!-- page-specific content -->
        <main class="main-dashboard p-6  mx-auto w-full">
          <div class=" mx-auto">
            <!-- Title -->
            <h2 class="text-3xl font-extrabold mb-6">Edit Profile</h2>

            <!-- Layout -->
            <div class="main-container flex flex-col lg:flex-row gap-8">
              <!-- Sidebar -->
              <div
                class="lg:w-1/3 xl:w-1/4 bg-gray-900 p-6 lg:p-8 border-b border-gray-700/50"
              >
                <!-- Profile Avatar -->
                <div class="flex flex-col items-center mb-8">
                  <div class="relative w-28 h-28 mb-3">
                    <img
                      src="https://placehold.co/112x112/334155/e2e8f0?text=Avatar"
                      alt="User Avatar"
                      class="w-28 h-28 rounded-full object-cover border-4 border-gray-700"
                    />
                  </div>
                  <h3 class="text-xl font-bold leading-tight">
                    Raghvendra Singh
                  </h3>
                  <p class="text-sm text-gray-400">@raghu</p>
                </div>

                <!-- Sidebar Navigation -->
                <nav id="profile-nav" class="space-y-1">
                  <a
                    href="#"
                    class="sidebar-link active flex items-center px-3 py-2 rounded-md bg-gray-700"
                  >
                    <i class="fas fa-user-circle mr-3 w-5"></i> Profile
                    Information
                  </a>
                  <a
                    href="#"
                    class="sidebar-link flex items-center px-3 py-2 rounded-md hover:bg-gray-700"
                  >
                    <i class="fas fa-lock mr-3 w-5"></i> Password Setting
                  </a>
                  <a
                    href="#"
                    class="sidebar-link flex items-center px-3 py-2 rounded-md hover:bg-gray-700"
                  >
                    <i class="fas fa-id-card mr-3 w-5"></i> NID Verification
                  </a>
                  <a
                    href="#"
                    class="sidebar-link flex items-center px-3 py-2 rounded-md hover:bg-gray-700"
                  >
                    <i class="fas fa-map-marked-alt mr-3 w-5"></i> Address
                    Verification
                  </a>
                </nav>
              </div>

              <!-- Right Content Area -->
              <div id="profile-content" class="lg:w-2/3 xl:w-3/4 p-6 lg:p-10">
                <div id="content-area" class="fade-enter-active"></div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- load includes and UI script -->
    <script src="js/include.js"></script>
    <script src="js/main.js"></script>
    <script>
      // Desktop sidebar toggle
      document.getElementById('desktopToggle').addEventListener('click', function() {
        document.body.classList.toggle('sidebar-hidden');
      });
    </script>
    <script>
      const contentArea = document.getElementById("content-area");
      const navLinks = document.querySelectorAll("#profile-nav .sidebar-link");

      // Full original Profile Information form (exactly as user provided)
      const profileContent = `
      <form onsubmit="event.preventDefault(); alert('Profile Updated (Mock Submission)');" class="fade-enter-active">
        <!-- Name Row -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">First Name</label>
            <input type="text" value="Raghvendra" required
              class="w-full p-3 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-700" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">Last Name</label>
            <input type="text" value="Singh" required
              class="w-full p-3 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-700" />
          </div>
        </div>

        <!-- Username & Email Row -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">Username</label>
            <input type="text" value="demouser" disabled
              class="cursor-not-allowed w-full p-3 rounded bg-gray-700 text-gray-400 border border-gray-600" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">Email Address</label>
            <div class="relative">
              <input type="email" value="demouser@tempmail.com" disabled
                class="cursor-not-allowed w-full p-3 rounded bg-gray-700 text-gray-400 pr-32 border border-gray-600" />
              <!-- Mock Tempmail Icons -->
              <div
                class="absolute inset-y-0 right-0 flex items-center pr-3 space-x-1 pointer-events-none select-none">
                <span class="text-xs">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="#10b981"
                    class="w-4 h-4">
                    <path
                      d="M464 64C490.5 64 512 85.5 512 112V400c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48V112C0 85.5 21.5 64 48 64H464zM240 256c-13.3 0-25.9-4.9-35.4-14.4l-72-72c-19-19-19-51.2 0-70.2s51.2-19 70.2 0l48 48 48-48c19-19 51.2-19 70.2 0s19 51.2 0 70.2l-72 72C265.9 251.1 253.3 256 240 256z" />
                  </svg>
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- Phone Number & Language Row -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">Phone Number</label>
            <div class="flex items-center">
              <input type="tel" value="+91 1234567891" required
                class="w-full p-3 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-700" />
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-400 mb-2">Preferred Language</label>
            <select class="w-full p-3 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-700">
              <option value="english">English</option>
              <option value="spanish" selected>Spanish</option>
              <option value="french">French</option>
            </select>
          </div>
        </div>

        <!-- Address Textarea -->
        <div class="mb-8">
          <label class="block text-sm font-medium text-gray-400 mb-2">Address</label>
          <textarea rows="3" class="w-full p-3 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-700"
            placeholder="Enter your full address here">India</textarea>
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit"
            class="px-6 py-3 bg-purple-700 text-gray-600 font-semibold rounded-lg hover:bg-purple-800 transition duration-150 ease-in-out">
            Submit
          </button>
        </div>
      </form>
    `;

      // Other tab contents simplified dummy forms
      const contents = {
        profile: profileContent,
        password: `
        <form onsubmit="event.preventDefault(); alert('Password Changed!')" class="space-y-6 fade-enter-active">
          <div>
            <label class="block text-sm mb-2 text-gray-400">Current Password</label>
            <input type="password" class="w-full p-3 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-700" />
          </div>
          <div>
            <label class="block text-sm mb-2 text-gray-400">New Password</label>
            <input type="password" class="w-full p-3 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-700" />
          </div>
          <div>
            <label class="block text-sm mb-2 text-gray-400">Confirm Password</label>
            <input type="password" class="w-full p-3 rounded bg-gray-800 text-white border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-700" />
          </div>
          <button class="px-6 py-3 bg-purple-700 text-gray-600 rounded-lg hover:bg-purple-800 transition">Change Password</button>
        </form>
      `,
        nid: `
        <div class="bg-gray-800 p-6 rounded-lg fade-enter-active">
          <h3 class="text-xl text-gray-300 font-semibold mb-4">NID Verification</h3>
          <p class="text-gray-400 mb-4">Upload your National ID document below for verification.</p>
          <input type="file" class="block w-full text-sm text-gray-300 border border-gray-700 rounded-lg cursor-pointer bg-gray-900 py-2" />
          <button class="mt-6 px-6 py-3 bg-purple-700 text-gray-600 rounded-lg hover:bg-purple-800 transition">Submit for Review</button>
        </div>
      `,
        address: `
        <div class="bg-gray-800 p-6 rounded-lg fade-enter-active">
          <h3 class="text-xl text-gray-300 font-semibold mb-4">Address Verification</h3>
          <p class="text-gray-400 mb-4">Provide proof of address (like a utility bill or bank statement).</p>
          <input type="file" class="block w-full text-sm text-gray-300 border border-gray-700 rounded-lg cursor-pointer bg-gray-900 py-2" />
          <button class="mt-6 px-6 py-3 bg-purple-700 text-gray-600 rounded-lg hover:bg-purple-800 transition">Submit for Review</button>
        </div>
      `,
      };

      // Initialize with Profile content
      contentArea.innerHTML = profileContent;

      // Handle tab click
      navLinks.forEach((link, index) => {
        link.addEventListener("click", (e) => {
          e.preventDefault();

          // Remove active from all, add to clicked
          navLinks.forEach((l) =>
            l.classList.remove("active", "bg-gray-700", "text-blue-400")
          );
          link.classList.add("active", "bg-gray-700", "text-blue-400");

          // Animate content fade out/in
          contentArea.classList.add("fade-enter");
          setTimeout(() => {
            if (index === 0) contentArea.innerHTML = contents.profile;
            if (index === 1) contentArea.innerHTML = contents.password;
            if (index === 2) contentArea.innerHTML = contents.nid;
            if (index === 3) contentArea.innerHTML = contents.address;

            contentArea.classList.remove("fade-enter");
            contentArea.classList.add("fade-enter-active");
          }, 200);
        });
      });

      function handleAvatarUpload(event) {
        const file = event.target.files[0];
        if (file) {
          // Mock preview update
          const reader = new FileReader();
          reader.onload = function (e) {
            const avatarImg = document.querySelector(".w-28.h-28.rounded-full");
            avatarImg.src = e.target.result;
            console.log("New avatar file selected:", file.name);
            // In a real application, you would send the file to the server here.
          };
          reader.readAsDataURL(file);
        }
      }
    </script>
  </body>
</html>
