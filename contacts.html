<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contacts - CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

    <div class="min-vh-100 flex">
          <!-- sidebar -->
  <div data-include="components/sidebar.html"></div>

  <div class="flex-1 flex flex-col min-h-screen">
    <!-- topbar -->
    <div data-include="components/topbar.html"></div>

    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
      <h1 class="text-2xl font-bold mb-6">Contacts</h1>

      <div class="bg-white rounded-lg border p-4">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold">All Contacts</h2>
          <button class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">+ New Contact</button>
        </div>

        <ul class="divide-y text-sm">
          <li class="py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <img src="https://i.pravatar.cc/40?img=1" class="w-10 h-10 rounded-full" alt="">
              <div>
                <p class="font-medium">Rohit Kumar</p>
                <p class="text-slate-500 text-xs">rohit@example.com</p>
              </div>
            </div>
            <span class="text-slate-400 text-xs">Added 2 days ago</span>
          </li>
          <!-- more contacts -->
        </ul>
      </div>
    </main>

    <!-- footer -->
    <div data-include="components/footer.html"></div>
  </div>


    </div>

  <script src="js/include.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
