<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Leads - CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .min-vh-100 {
        min-height: 100vh;
      }
      .card-transition {
        transition: box-shadow 0.12s ease, transform 0.12s ease;
      }
      .card-transition:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(2, 6, 23, 0.08);
      }
    </style>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap");
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-body);
      }
      .container-card {
        background-color: var(--bg-card);
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2),
          0 4px 6px -2px rgba(0, 0, 0, 0.1);
      }
      input[type="text"] {
        background-color: var(--bg-body);
        border: 1px solid var(--border-card);
        color: var(--text-button);
        padding: 0.75rem 1rem;
        border-radius: 0.5rem 0 0 0.5rem; /* Only round left corners */
        transition: all 0.15s ease-in-out;
        flex-grow: 1;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: #6366f1;
      }

      /* Custom mobile row styling */
      @media (max-width: 767px) {
        .mobile-card {
          padding: 1rem;
          background-color: var(--bg-card);
          border-radius: 0.75rem;
          border: 1px solid var(--border-card);
        }
        .mobile-row-item {
          display: flex;
          justify-content: space-between;
          padding-top: 0.4rem;
          padding-bottom: 0.4rem;
        }
        .mobile-row-item .label {
          font-weight: 500;
          color: var(--text-secondary);
          font-size: 0.875rem;
        }
        .mobile-row-item .value {
          font-weight: 600;
          font-size: 0.875rem;
          text-align: right;
        }
      }
      .pagination-active {
        background-color: #10b981; /* green-500 for active state */
        color: white;
        font-weight: bold;
      }

      html,
      body {
        height: 100vh;
        overflow: hidden;
      }

      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        overflow-y: auto;
        width: 19rem;
      }

      .main-container {
        margin-left: 19rem;
        height: 100vh;
        overflow-y: auto;
      }

      @media (max-width: 1023px) {
        .main-container {
          margin-left: 0;
        }
      }

      /* Scrollbar styling for main container */
      .main-container::-webkit-scrollbar {
        width: 6px;
      }
      .main-container::-webkit-scrollbar-track {
        background: transparent;
      }
      .main-container::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
      }
      .main-container::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.4);
      }
    </style>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="antialiased">
    <div>
      <div data-include="components/sidebar.html"></div>

      <!-- main column: topbar + page content + footer -->
      <div class="main-container main-dashboard flex flex-col">
        <!-- topbar -->
        <header class="topbar p-4 text-white ml-6 mr-6 mt-10 rounded-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <!-- Mobile menu button -->
            <button id="mobileToggle" class="lg:hidden p-2 rounded-md">
              <svg
                class="w-5 h-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                class=""
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                  class=""
                />
              </svg>
            </button>
          </div>

          <div class="flex items-center gap-4 header-right">
            <button
              id="themeToggle"
              class="p-3 w-12 h-12 rounded-lg flex items-center justify-center text-slate-700 transition"
            >
              <svg
                id="themeIcon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-moon"
              >
                <path
                  d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                  class=""
                />
              </svg>
            </button>
            <div class="relative">
              <button
                id="profileBtn"
                class="flex items-center gap-2 p-1 rounded-md hover:bg-gray-600"
              >
                <img
                  src="https://i.pravatar.cc/40"
                  alt="avatar"
                  class="w-8 h-8 rounded-full"
                />
                <span class="hidden sm:block text-sm">Raghav</span>
                <svg
                  class="w-4 h-4"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                  class=""
                >
                  <path
                    fill-rule="evenodd"
                    d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z"
                    clip-rule="evenodd"
                    class=""
                  />
                </svg>
              </button>

              <!-- Profile dropdown -->
              <div
                id="profileDropdown"
                class="hidden absolute right-0 mt-2 w-44 py-1"
              >
              <a href="index.html" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >Dashboard</a
                >
                <a href="profile.html" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >My Profile</a
                >
                <a href="two-factor.html" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >2FA Security</a
                >
                <a href="#" class="block px-3 py-2 text-sm hover:bg-gray-600"
                  >logout out</a
                >
              </div>
            </div>
          </div>
        </div>
      </header>

        <!-- page-specific content -->
        <main class="main-dashboard  p-6 max-w-7xl mx-auto w-full">
          <div class="max-w-7xl mx-auto">
            <!-- Title -->
            <h2 class="text-3xl font-extrabold mb-6 text-white">My Referral</h2>

            <!-- Referral Link Section -->
            <div class="mb-8">
              <label
                for="referral-link"
                class="block text-lg font-semibold text-gray-300 mb-2"
                >Referral Link</label
              >
              <div class="flex">
                <input
                  type="text"
                  id="referral-link"
                  value="https://hyip-pro.bugfinder.app/register/demouser"
                  readonly
                />
                <button
                  id="copy-btn"
                  class="px-6 py-3 bg-purple-700 text-gray-600 font-semibold rounded-r-lg hover:bg-purple-800 transition duration-150 ease-in-out flex items-center justify-center whitespace-nowrap"
                >
                  Copy Link
                </button>
              </div>
              <p
                id="copy-message"
                class="text-sm mt-2 text-lime-400 opacity-0 transition duration-300"
              >
                Link copied!
              </p>
            </div>
            <!-- Filter Bar -->
            <div class="mb-6">
              <div class="flex flex-wrap gap-4 items-end">
                <div class="flex w-[170px] h-[42px]">
                  <input type="text" id="filter-username" class="w-full px-3 py-2  border border-gray-600 rounded-lg text-white" placeholder="Filter by username">
                </div>
                <div class="flex w-[170px] h-[42px]">
                  <input type="text" id="filter-email" class="w-full px-3 py-2  border border-gray-600 rounded-md text-white" placeholder="Filter by email">
                </div>
                <div class="flex w-[170px]">
                  <input type="date" id="filter-joined" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-white">
                </div>
                <button id="apply-filter" class="px-4 py-2 bg-purple-700 text-gray-600 rounded-md hover:bg-purple-700">Apply Filter</button>
                <button id="clear-filter" class="px-4 py-2 bg-purple-700 text-white rounded-md hover:bg-purple-800">Clear Filter</button>
              </div>
            </div>

            <!-- Referral List Table Container -->
            <div class="container-card overflow-x-auto">
              <!-- Standard Table for Desktop/Tablet (md and up) -->
              <div class="hidden md:block">
                <table class="min-w-full divide-y divide-gray-700">
                  <thead class="table-head">
                    <tr>
                      <th
                        class="px-4 py-5 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-2/12"
                      >
                        Username
                      </th>
                      <th
                        class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-1/12"
                      >
                        Level
                      </th>
                      <th
                        class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-3/12"
                      >
                        Email
                      </th>
                      <th
                        class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-3/12"
                      >
                        Phone Number
                      </th>
                      <th
                        class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-2/12"
                      >
                        Joined At
                      </th>
                    </tr>
                  </thead>
                  <tbody
                    id="desktop-table-body"
                    class="divide-y divide-gray-700 table-body"
                  >
                    <!-- Table rows will be inserted here by JavaScript -->
                  </tbody>
                </table>
              </div>

              <!-- Card List for Mobile (less than md) -->
              <div id="mobile-card-list" class="md:hidden space-y-4">
                <!-- Mobile cards will be inserted here by JavaScript -->
              </div>

              <!-- Pagination Bar -->
              <div class="py-4 flex justify-center table-body">
                <nav
                  class="flex items-center space-x-1"
                  aria-label="Pagination"
                >
                  <button
                    id="prev-btn"
                    onclick="goToPage(currentPage - 1)"
                    class="px-3 py-2 text-sm font-medium rounded-lg text-gray-200 transition disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    <i class="fas fa-chevron-left"></i>
                  </button>

                  <!-- Page Buttons (1-3 functional) -->
                  <button
                    class="page-btn px-4 py-2 text-sm font-medium rounded-lg text-gray-200 transition"
                    onclick="goToPage(1)"
                  >
                    1
                  </button>
                  <button
                    class="page-btn px-4 py-2 text-sm font-medium rounded-lg text-gray-200 transition"
                    onclick="goToPage(2)"
                  >
                    2
                  </button>
                  <button
                    class="page-btn px-4 py-2 text-sm font-medium rounded-lg text-gray-200 transition"
                    onclick="goToPage(3)"
                  >
                    3
                  </button>

                  <!-- Inactive/Placeholder Buttons -->
                  <!-- <span class="text-gray-400 px-2 hidden sm:inline">...</span>
                  <button
                    class="px-4 py-2 text-sm font-medium rounded-lg text-gray-200 transition hidden sm:inline"
                    disabled
                  >
                    11
                  </button> -->

                  

                  <button
                    id="next-btn"
                    onclick="goToPage(currentPage + 1)"
                    class="px-3 py-2 text-sm font-medium rounded-lg text-gray-200 transition disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    <i class="fas fa-chevron-right"></i>
                  </button>
                </nav>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- load includes and UI script -->
    <script src="js/include.js"></script>
    <script src="js/main.js"></script>
<script>
  // ✅ Define constants first
  const ENTRIES_PER_PAGE = 5;

  // Mock data for 3 pages
  const data = [
    // Page 1
    { user: "Bret", level: "Level 1", email: "Q335h138i@Example.Net", phone: "01600000000", joined: "24 Oct 2025" },
    { user: "Karianne", level: "Level 1", email: "Pm6o5o0bm0@Example.Biz", phone: "4931709623", joined: "21 Oct 2025" },
    { user: "Kacchi", level: "Level 2", email: "Onjim19s2u@Example.Net", phone: "+3765456545654", joined: "17 Oct 2025" },
    { user: "Asdwax", level: "Level 1", email: "79gqj0kpghg@Example.Com", phone: "+93564646464", joined: "23 Oct 2025" },
    { user: "Matech", level: "Level 1", email: "J7t80own0@Example.Net", phone: "+233+23324111777", joined: "16 Oct 2025" },
    // Page 2
    { user: "Ravikumar123", level: "Level 1", email: "2vf483bil@Example.Com", phone: "+919918208077", joined: "19 Oct 2025" },
    { user: "Shashi", level: "Level 2", email: "Zi63h9pkm5@Example.Com", phone: "+91+9186603731000", joined: "24 Oct 2025" },
    { user: "Kwabena", level: "Level 1", email: "V67ekwmyzo@Example.Com", phone: "+233+233232344676", joined: "24 Oct 2025" },
    { user: "Ddjjgj", level: "Level 1", email: "Gq39fsfe54@Example.Biz", phone: "+91+393939393919", joined: "19 Oct 2025" },
    { user: "Hanumant09", level: "Level 1", email: "Q5epgw10er@Example.Net", phone: "+91+919766302713", joined: "21 Oct 2025" },
    // Page 3
    { user: "Solangi200", level: "Level 1", email: "Gbpkulexcj@Example.Biz", phone: "+92+923312266200", joined: "27 Oct 2025" },
    { user: "Prueba1997", level: "Level 2", email: "9z9g5jbi1ee@Example.Biz", phone: "+51+51936272729", joined: "23 Oct 2025" },
    { user: "UserA_24", level: "Level 1", email: "user_a@Example.Net", phone: "1234567890", joined: "10 Oct 2025" },
    { user: "TestRefB", level: "Level 1", email: "test.b@Example.Com", phone: "9876543210", joined: "05 Oct 2025" },
    { user: "NewReferral", level: "Level 3", email: "new_ref@Example.Net", phone: "5551234567", joined: "01 Oct 2025" },
  ];

  let filteredData = [...data];
  let totalPages = Math.ceil(filteredData.length / ENTRIES_PER_PAGE);
  let currentPage = 1;

  function getUsernameDisplay(username) {
    return `
      <span class="flex items-center space-x-2">
        <span class="w-2.5 h-2.5 bg-lime-500 rounded-full"></span>
        <span class="text-white font-medium">${username}</span>
      </span>
    `;
  }

  function renderTable(page) {
    const start = (page - 1) * ENTRIES_PER_PAGE;
    const end = start + ENTRIES_PER_PAGE;
    const pageData = filteredData.slice(start, end);

    const desktopBody = document.getElementById("desktop-table-body");
    const mobileList = document.getElementById("mobile-card-list");

    desktopBody.innerHTML = "";
    mobileList.innerHTML = "";

    pageData.forEach((item) => {
      const usernameHtml = getUsernameDisplay(item.user);
      const levelClass = item.level === "Level 1" ? "text-green-500" : "text-indigo-500";

      // Desktop Row
      desktopBody.insertAdjacentHTML("beforeend", `
        <tr class="hover:bg-gray-700/30 transition duration-150">
          <td class="px-4 py-3 whitespace-nowrap text-sm">${usernameHtml}</td>
          <td class="px-4 py-3 whitespace-nowrap text-sm ${levelClass}">${item.level}</td>
          <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-300">${item.email}</td>
          <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-300">${item.phone}</td>
          <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-300">${item.joined}</td>
        </tr>
      `);

      // Mobile Card
      mobileList.insertAdjacentHTML("beforeend", `
        <div class="mobile-card space-y-1">
          <div class="flex justify-between items-center pb-2 border-b border-gray-700/50 mb-1">
            <div class="text-sm font-bold text-white">${usernameHtml}</div>
            <span class="text-xs font-semibold ${levelClass}">${item.level}</span>
          </div>
          <div class="mobile-row-item"><span class="label">Email:</span><span class="value text-gray-300">${item.email}</span></div>
          <div class="mobile-row-item"><span class="label">Phone:</span><span class="value text-gray-300">${item.phone}</span></div>
          <div class="mobile-row-item"><span class="label">Joined:</span><span class="value text-gray-300">${item.joined}</span></div>
        </div>
      `);
    });
  }

  function updatePaginationControls() {
    const nav = document.querySelector('nav[aria-label="Pagination"]');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // Remove old buttons
    document.querySelectorAll('.page-btn').forEach(btn => btn.remove());

    // Add new page buttons
    for (let i = 1; i <= totalPages; i++) {
      const btn = document.createElement('button');
      btn.className = 'page-btn px-4 py-2 text-sm font-medium rounded-lg text-gray-200 transition';
      btn.textContent = i;
      btn.onclick = () => goToPage(i);
      nav.insertBefore(btn, nextBtn);
    }

    // Highlight current page
    document.querySelectorAll('.page-btn').forEach(btn => {
      btn.classList.remove('pagination-active');
      if (parseInt(btn.textContent) === currentPage) {
        btn.classList.add('pagination-active');
      }
    });

    prevBtn.disabled = currentPage === 1;
    nextBtn.disabled = currentPage === totalPages;
  }

  function goToPage(page) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    renderTable(page);
    updatePaginationControls();
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const date = new Date(dateStr);
    const day = String(date.getDate()).padStart(2, '0');
    const month = date.toLocaleString('en', { month: 'short' });
    const year = date.getFullYear();
    return `${day} ${month} ${year}`;
  }

  // ✅ Filter logic
  function applyFilter() {
    const username = document.getElementById('filter-username').value.toLowerCase();
    const email = document.getElementById('filter-email').value.toLowerCase();
    const joined = document.getElementById('filter-joined').value;
    const joinedFormatted = formatDate(joined).toLowerCase();

    if (!username && !email && !joined) {
      filteredData = [...data];
    } else {
      filteredData = data.filter(item => {
        const userMatch = username ? item.user.toLowerCase().includes(username) : false;
        const emailMatch = email ? item.email.toLowerCase().includes(email) : false;
        const joinedMatch = joined ? item.joined.toLowerCase().includes(joinedFormatted) : false;
        return userMatch || emailMatch || joinedMatch;
      });
    }

    totalPages = Math.ceil(filteredData.length / ENTRIES_PER_PAGE);
    goToPage(1);
  }

  function clearFilter() {
    document.getElementById('filter-username').value = '';
    document.getElementById('filter-email').value = '';
    document.getElementById('filter-joined').value = '';
    filteredData = [...data];
    totalPages = Math.ceil(filteredData.length / ENTRIES_PER_PAGE);
    goToPage(1);
  }

  // Copy link
  document.getElementById("copy-btn").addEventListener("click", () => {
    const linkInput = document.getElementById("referral-link");
    const message = document.getElementById("copy-message");
    linkInput.select();
    document.execCommand("copy");
    message.classList.remove("opacity-0");
    message.classList.add("opacity-100");
    setTimeout(() => {
      message.classList.remove("opacity-100");
      message.classList.add("opacity-0");
    }, 1500);
  });

  // ✅ Initialize everything
  document.getElementById('apply-filter').addEventListener('click', applyFilter);
  document.getElementById('clear-filter').addEventListener('click', clearFilter);

  window.onload = () => {
    goToPage(1); // Show page 1 by default
  };
</script>

  </body>
</html>
