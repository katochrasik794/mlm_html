<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Leads - CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .min-vh-100 {
        min-height: 100vh;
      }
      .card-transition {
        transition: box-shadow 0.12s ease, transform 0.12s ease;
      }
      .card-transition:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(2, 6, 23, 0.08);
      }
    </style>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap");
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-body);
      }
      .container-card {
        background-color: var(--bg-card);
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2),
          0 4px 6px -2px rgba(0, 0, 0, 0.1);
      }
      input[type="text"] {
        background-color: var(--bg-button);
        border: 1px solid var(--border-card);
        color: var(--text-button);
        padding: 0.75rem 1rem;
        border-radius: 0.5rem 0 0 0.5rem; /* Only round left corners */
        transition: all 0.15s ease-in-out;
        flex-grow: 1;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: #6366f1;
      }

      /* Custom mobile row styling */
      @media (max-width: 767px) {
        .mobile-card {
          padding: 1rem;
          background-color: var(--bg-card);
          border-radius: 0.75rem;
          border: 1px solid var(--border-card);
        }
        .mobile-row-item {
          display: flex;
          justify-content: space-between;
          padding-top: 0.4rem;
          padding-bottom: 0.4rem;
        }
        .mobile-row-item .label {
          font-weight: 500;
          color: var(--text-secondary);
          font-size: 0.875rem;
        }
        .mobile-row-item .value {
          font-weight: 600;
          font-size: 0.875rem;
          text-align: right;
        }
      }
      .pagination-active {
        background-color: #10b981; /* green-500 for active state */
        color: white;
        font-weight: bold;
      }

      html,
      body {
        height: 100vh;
        overflow: hidden;
      }

      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        overflow-y: auto;
        width: 19rem;
      }

      .main-container {
        margin-left: 19rem;
        height: 100vh;
        overflow-y: auto;
      }

      @media (max-width: 767px) {
        .main-container {
          margin-left: 0;
        }
      }
    </style>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-gray-900 text-slate-900 antialiased">
    <div>
      <div data-include="components/sidebar.html"></div>

      <!-- main column: topbar + page content + footer -->
      <div class="main-container flex flex-col">
        <!-- topbar -->
        <header
          class="w-full border-b p-4 sticky text-white bg-gray-800 top-0 z-30"
        >
          <div
            class="max-w-7xl mx-auto flex items-center justify-between gap-4"
          >
            <div class="flex items-center gap-3">
              <!-- Mobile menu button -->
              <button id="mobileToggle" class="md:hidden p-2 rounded-md">
                <svg
                  class="w-5 h-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"
                  />
                </svg>
              </button>
            </div>

            <div class="flex items-center gap-4">
              <button
                id="themeToggle"
                class="p-3 w-12 h-12 rounded-lg flex items-center justify-center text-slate-700 transition"
              >
                <svg
                  id="themeIcon"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-moon"
                >
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
              </button>
              <div class="relative">
                <button
                  id="profileBtn"
                  class="flex items-center gap-2 p-1 rounded-md hover:bg-gray-600"
                >
                  <img
                    src="https://i.pravatar.cc/40"
                    alt="avatar"
                    class="w-8 h-8 rounded-full"
                  />
                  <span class="hidden sm:block text-sm">Raghav</span>
                  <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
                    <path
                      fill-rule="evenodd"
                      d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z"
                      clip-rule="evenodd"
                    />
                  </svg>
                </button>

                <!-- Profile dropdown -->
                <div
                  id="profileDropdown"
                  class="hidden absolute right-0 mt-2 w-44 bg-gray-800 border rounded-md shadow-sm py-1"
                >
                  <a href="#" class="block px-3 py-2 text-sm hover:bg-gray-600"
                    >Profile</a
                  >
                  <a href="#" class="block px-3 py-2 text-sm hover:bg-gray-600"
                    >Settings</a
                  >
                  <a href="#" class="block px-3 py-2 text-sm hover:bg-gray-600"
                    >Sign out</a
                  >
                </div>
              </div>
            </div>
          </div>
        </header>

        <!-- page-specific content -->
        <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
          <div class="max-w-7xl mx-auto">
            <!-- Title -->
            <h2 class="text-3xl font-extrabold mb-6 text-white">My Referral</h2>

            <!-- Referral Link Section -->
            <div class="mb-8">
              <label
                for="referral-link"
                class="block text-lg font-semibold text-gray-300 mb-2"
                >Referral Link</label
              >
              <div class="flex">
                <input
                  type="text"
                  id="referral-link"
                  value="https://hyip-pro.bugfinder.app/register/demouser"
                  readonly
                />
                <button
                  id="copy-btn"
                  class="px-6 py-3 bg-purple-700 text-gray-600 font-semibold rounded-r-lg hover:bg-purple-800 transition duration-150 ease-in-out flex items-center justify-center whitespace-nowrap"
                >
                  Copy Link
                </button>
              </div>
              <p
                id="copy-message"
                class="text-sm mt-2 text-lime-400 opacity-0 transition duration-300"
              >
                Link copied!
              </p>
            </div>

            <!-- Referral List Table Container -->
            <div class="container-card p-2 md:p-6 overflow-x-auto">
              <!-- Standard Table for Desktop/Tablet (md and up) -->
              <div class="hidden md:block">
                <table class="min-w-full divide-y divide-gray-700">
                  <thead class="bg-gray-800">
                    <tr>
                      <th
                        class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-2/12"
                      >
                        Username
                      </th>
                      <th
                        class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-1/12"
                      >
                        Level
                      </th>
                      <th
                        class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-3/12"
                      >
                        Email
                      </th>
                      <th
                        class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-3/12"
                      >
                        Phone Number
                      </th>
                      <th
                        class="px-4 py-4 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-2/12"
                      >
                        Joined At
                      </th>
                    </tr>
                  </thead>
                  <tbody
                    id="desktop-table-body"
                    class="divide-y divide-gray-700"
                  >
                    <!-- Table rows will be inserted here by JavaScript -->
                  </tbody>
                </table>
              </div>

              <!-- Card List for Mobile (less than md) -->
              <div id="mobile-card-list" class="md:hidden space-y-4">
                <!-- Mobile cards will be inserted here by JavaScript -->
              </div>

              <!-- Pagination Bar -->
              <div class="mt-8 flex justify-center">
                <nav
                  class="flex items-center space-x-1"
                  aria-label="Pagination"
                >
                  <button
                    id="prev-btn"
                    onclick="goToPage(currentPage - 1)"
                    class="px-3 py-2 text-sm font-medium rounded-lg text-gray-200 transition disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    <i class="fas fa-chevron-left"></i>
                  </button>

                  <!-- Page Buttons (1-3 functional) -->
                  <button
                    class="page-btn px-4 py-2 text-sm font-medium rounded-lg text-gray-200 transition"
                    onclick="goToPage(1)"
                  >
                    1
                  </button>
                  <button
                    class="page-btn px-4 py-2 text-sm font-medium rounded-lg text-gray-200 transition"
                    onclick="goToPage(2)"
                  >
                    2
                  </button>
                  <button
                    class="page-btn px-4 py-2 text-sm font-medium rounded-lg text-gray-200 transition"
                    onclick="goToPage(3)"
                  >
                    3
                  </button>

                  <!-- Inactive/Placeholder Buttons -->
                  <span class="text-gray-400 px-2 hidden sm:inline">...</span>
                  <button
                    class="px-4 py-2 text-sm font-medium rounded-lg text-gray-200 transition hidden sm:inline"
                    disabled
                  >
                    11
                  </button>

                  <button
                    id="next-btn"
                    onclick="goToPage(currentPage + 1)"
                    class="px-3 py-2 text-sm font-medium rounded-lg text-gray-200 transition disabled:opacity-50 disabled:cursor-not-allowed"
                  >
                    <i class="fas fa-chevron-right"></i>
                  </button>
                </nav>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

      let currentPage = 1;
      const ENTRIES_PER_PAGE = 5;
      const MAX_PAGES = 3; // Enforcing max 3 functional pages

      function getUsernameDisplay(username) {
        // Green circle indicator
        return `
            <span class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 bg-lime-500 rounded-full"></span>
                <span class="text-white font-medium">${username}</span>
            </span>
        `;
      }

      function renderTable(page) {
        const start = (page - 1) * ENTRIES_PER_PAGE;
        const end = start + ENTRIES_PER_PAGE;
        const pageData = data.slice(start, end);

        const desktopBody = document.getElementById("desktop-table-body");
        const mobileList = document.getElementById("mobile-card-list");

        desktopBody.innerHTML = "";
        mobileList.innerHTML = "";

        pageData.forEach((item) => {
          const usernameHtml = getUsernameDisplay(item.user);
          const levelClass =
            item.level === "Level 1" ? "text-green-500" : "text-indigo-500";

          // --- Desktop Row (TR) ---
          const desktopRow = `
                <tr class="hover:bg-gray-700/30 transition duration-150">
                    <td class="px-4 py-3 whitespace-nowrap text-sm">${usernameHtml}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm ${levelClass}">${item.level}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-300">${item.email}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-300">${item.phone}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-300">${item.joined}</td>
                </tr>
            `;
          desktopBody.insertAdjacentHTML("beforeend", desktopRow);

          // --- Mobile Card (DIV) ---
          const mobileCard = `
                <div class="mobile-card space-y-1">
                    <div class="flex justify-between items-center pb-2 border-b border-gray-700/50 mb-1">
                        <div class="text-sm font-bold text-white">${usernameHtml}</div>
                        <span class="text-xs font-semibold ${levelClass}">${item.level}</span>
                    </div>
                    <div class="mobile-row-item"><span class="label">Email:</span> <span class="value text-gray-300">${item.email}</span></div>
                    <div class="mobile-row-item"><span class="label">Phone:</span> <span class="value text-gray-300">${item.phone}</span></div>
                    <div class="mobile-row-item"><span class="label">Joined:</span> <span class="value text-gray-300">${item.joined}</span></div>
                </div>
            `;
          mobileList.insertAdjacentHTML("beforeend", mobileCard);
        });
      }

      function updatePaginationControls() {
        // Update active button styling
        document.querySelectorAll(".page-btn").forEach((btn) => {
          btn.classList.remove("pagination-active");
          btn.classList.add("text-gray-400", "hover:bg-gray-700/50");
          if (parseInt(btn.textContent) === currentPage) {
            btn.classList.add("pagination-active");
            btn.classList.remove("text-gray-400", "hover:bg-gray-700/50");
          }
        });

        // Update Prev/Next button disabled state
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");

        // Disable 'Previous' if on page 1
        prevBtn.disabled = currentPage === 1;

        // Disable 'Next' if on the last functional page (MAX_PAGES = 3)
        nextBtn.disabled = currentPage === MAX_PAGES;
      }

      function goToPage(page) {
        // Boundary check to ensure the page is within the functional limits
        if (page < 1 || page > MAX_PAGES) {
          return;
        }
        currentPage = page;
        renderTable(currentPage);
        updatePaginationControls();
      }

      // Function to copy the referral link
      function copyLink() {
        const linkInput = document.getElementById("referral-link");
        const message = document.getElementById("copy-message");

        // Use document.execCommand('copy') for better compatibility in iframe environments
        linkInput.select();
        document.execCommand("copy");

        // Show success message briefly
        message.classList.remove("opacity-0");
        message.classList.add("opacity-100");
        setTimeout(() => {
          message.classList.remove("opacity-100");
          message.classList.add("opacity-0");
        }, 1500);
      }

      // Attach event listener to the copy button
      document.getElementById("copy-btn").addEventListener("click", copyLink);

      // Initialize the table on load
      window.onload = () => {
        goToPage(1);
      };
    </script>
  </body>
</html>
